<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gopi Jewellers ERP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --debit-red: #e74c3c; --credit-green: #27ae60; --navy: #1e3a8a; }
        html, body { height: 100%; margin: 0; padding: 0; background: #f0f2f5; font-family: -apple-system, sans-serif; }
        .container { background: white; width: 100%; min-height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        .page { display: none; flex-direction: column; padding: 10px; box-sizing: border-box; min-height: 100vh; }
        .page.active { display: flex; }
        .header { text-align: center; border-bottom: 3px solid var(--gold); padding-bottom: 8px; margin-bottom: 12px; }
        
        /* MENU PAGE */
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 25px; flex-grow: 1; align-content: center; }
        .menu-card { background: var(--dark); color: white; padding: 45px 20px; border-radius: 15px; text-align: center; border: 4px solid var(--gold); cursor: pointer; }
        .menu-card h2 { margin: 10px 0 0; font-size: 26px; text-transform: uppercase; font-weight: 900; }

        /* COMMON UI */
        select, .btn-nav, .btn-footer { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }
        .btn-nav { background: var(--gold); color: var(--dark); text-transform: uppercase; margin-bottom: 8px; }
        .btn-footer { margin-top: 10px; color: white; text-transform: uppercase; }
        .input-card { padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 2px solid #ddd; background: #f9f9f9; }
        input { width: 100%; padding: 15px; border: 2px solid #ccc; border-radius: 6px; font-size: 18px; font-weight: bold; box-sizing: border-box; margin-top: 5px; }
        .table-wrap { flex-grow: 1; min-height: 400px; overflow: auto; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; background: white; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; font-size: 16px; font-weight: bold; }
        th { position: sticky; top: 0; background: #eee; z-index: 10; border-bottom: 3px solid #ddd; padding: 12px; }
        td { padding: 12px; text-align: center; border: 1px solid #ddd; }
        
        /* MODAL */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="page active" style="justify-content:center; align-items:center; text-align:center;">
        <img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:120px; margin-bottom: 20px;">
        <h1>Gopi Jewellers</h1>
        <input type="password" id="passInput" placeholder="Password" style="text-align:center; width: 80%;">
        <button class="btn-footer" style="background:var(--gold); color:var(--dark); width: 80%;" onclick="checkPass()">LOGIN</button>
    </div>

    <div id="main-menu" class="page">
        <div class="header"><h2>Control Panel</h2></div>
        <div class="menu-grid">
            <div class="menu-card" onclick="openModule('jobwork-page')">⚖️<h2>Karigar Jobwork</h2></div>
            <div class="menu-card" onclick="openModule('cash-page')">💸<h2>Karigar Cash</h2></div>
            <div class="menu-card" onclick="openModule('cust-page')" style="background:var(--navy);">👤<h2>Add Customer</h2></div>
        </div>
    </div>

    <div id="cust-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding: 10px; font-size: 14px;" onclick="openModule('main-menu')">← BACK TO MENU</button>
        <div class="header"><h3>Customer Management</h3></div>
        <div class="input-card">
            <input type="text" id="custName" placeholder="Customer Name">
            <input type="text" id="custPhone" placeholder="Phone Number">
            <input type="text" id="custAddr" placeholder="City/Address">
            <button class="btn-footer" style="background:var(--credit-green);" onclick="addCustomer()">SAVE CUSTOMER</button>
        </div>
        <div class="table-wrap">
            <table style="min-width: 100%;">
                <thead><tr><th>Name</th><th>Phone</th><th>Address</th><th>Action</th></tr></thead>
                <tbody id="custList"></tbody>
            </table>
        </div>
    </div>

    <div id="jobwork-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding: 10px; font-size: 14px;" onclick="openModule('main-menu')">← BACK TO MENU</button>
        <div class="header"><img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:60px;"></div>
        <select id="karigarSelectorGold" onchange="switchKarigar(this.value)"></select>
        <button class="btn-nav" onclick="showModal()">+ REGISTER NEW KARIGAR</button>
        <div class="input-card" style="border-left:10px solid var(--debit-red);"><div style="display:flex; gap:5px;"><input type="text" id="drDate" placeholder="Date"><input type="text" id="drSaman" placeholder="Saman"><input type="number" id="drWt" step="0.001" placeholder="Wt"></div><button class="btn-footer" style="background:var(--debit-red);" onclick="addEntry('dr')">ADD ISSUE (DR)</button></div>
        <div class="input-card" style="border-left:10px solid var(--credit-green);"><div style="display:flex; gap:5px;"><input type="text" id="crDate" placeholder="Date"><input type="text" id="crSaman" placeholder="Saman"><input type="number" id="crWt" step="0.001" placeholder="Wt"></div><button class="btn-footer" style="background:var(--credit-green);" onclick="addEntry('cr')">ADD JAMA (CR)</button></div>
        <div class="table-wrap"><table><tbody id="ledgerBodyGold"></tbody></table></div>
    </div>

    <div id="cash-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding: 10px; font-size: 14px;" onclick="openModule('main-menu')">← BACK TO MENU</button>
        <div class="header"><h3>CASH LEDGER</h3></div>
        <select id="karigarSelectorCash" onchange="switchKarigar(this.value)"></select>
        <div class="input-card" style="border-left:10px solid var(--navy);"><input type="text" id="cashDate" placeholder="Date"><input type="text" id="cashPart" placeholder="Particulars"><input type="number" id="cashAmt" placeholder="Amount"><button class="btn-footer" style="background:var(--navy);" onclick="addCashEntry()">ADD ENTRY</button></div>
        <div class="table-wrap"><table><tbody id="ledgerBodyCash"></tbody></table></div>
    </div>
</div>

<div id="modal"><div style="background:white; padding:25px; border-radius:12px; width:95%; max-width:400px; text-align:center;"><h2>New Karigar</h2><input type="text" id="newName" placeholder="Name"><button class="btn-footer" style="background:var(--credit-green);" onclick="registerKarigar()">SAVE</button><button class="btn-footer" style="background:#999;" onclick="hideModal()">CANCEL</button></div></div>

<script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbx0G79ae_2xJR8kBKE2CxjL_62qOUv0_BqzzmTN5YhopZ61XTg0F499a8QvQ3cTpGjcXw/exec";
    const SHOP_PASS = "1234";
    let masterData = { karigars: {}, customers: {} };
    let activeId = "";

    function checkPass() { if(document.getElementById('passInput').value === SHOP_PASS) { openModule('main-menu'); loadFromServer(); } else alert("Wrong Password!"); }
    function openModule(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function showModal() { document.getElementById('modal').style.display = 'flex'; }
    function hideModal() { document.getElementById('modal').style.display = 'none'; }

    async function loadFromServer() {
        try {
            const r = await fetch(CLOUD_URL); const t = await r.text();
            const cloudData = t.trim() ? JSON.parse(t) : {};
            if(cloudData.karigars) masterData.karigars = cloudData.karigars;
            if(cloudData.customers) masterData.customers = cloudData.customers;
            activeId = localStorage.getItem('gopi_active_id') || Object.keys(masterData.karigars)[0] || "";
            refreshUI();
        } catch (e) { masterData = JSON.parse(localStorage.getItem('gopi_master_cloud')) || masterData; refreshUI(); }
    }

    function saveData() {
        localStorage.setItem('gopi_master_cloud', JSON.stringify(masterData));
        fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(masterData) });
    }

    function refreshUI() {
        const selG = document.getElementById('karigarSelectorGold'), selC = document.getElementById('karigarSelectorCash');
        selG.innerHTML = ''; selC.innerHTML = '';
        Object.keys(masterData.karigars).forEach(id => {
            const opt = `<option value="${id}" ${id === activeId ? 'selected' : ''}>${masterData.karigars[id].name}</option>`;
            selG.innerHTML += opt; selC.innerHTML += opt;
        });
        
        const custBody = document.getElementById('custList'); custBody.innerHTML = '';
        Object.keys(masterData.customers).forEach(id => {
            const c = masterData.customers[id];
            custBody.innerHTML += `<tr><td>${c.name}</td><td>${c.phone}</td><td>${c.addr}</td><td><button onclick="deleteCust('${id}')" style="background:red; color:white; border:none; padding:5px; border-radius:4px;">x</button></td></tr>`;
        });
        renderGold(); renderCash();
    }

    function addCustomer() {
        const name = document.getElementById('custName').value;
        if(!name) return alert("Enter Name");
        const id = "C_" + Date.now();
        masterData.customers[id] = { name, phone: document.getElementById('custPhone').value, addr: document.getElementById('custAddr').value };
        saveData(); refreshUI();
        document.getElementById('custName').value = ''; document.getElementById('custPhone').value = ''; document.getElementById('custAddr').value = '';
    }

    function deleteCust(id) { if(confirm("Delete Customer?")) { delete masterData.customers[id]; saveData(); refreshUI(); } }

    /* Restoration of Karigar Logic */
    function switchKarigar(id) { activeId = id; localStorage.setItem('gopi_active_id', id); refreshUI(); }
    function registerKarigar() { 
        const name = document.getElementById('newName').value; if(!name) return;
        const id = "K_" + Date.now(); masterData.karigars[id] = { name, dr: [], cr: [], cash: [] };
        activeId = id; saveData(); hideModal(); refreshUI();
    }
    function addEntry(type) {
        const val = parseFloat(document.getElementById(type + 'Wt').value); if (isNaN(val)) return;
        let entry = { date: document.getElementById(type + 'Date').value, saman: document.getElementById(type + 'Saman').value, val: val };
        if (type === 'cr') entry.rounded = val < 1 ? 0 : ((val % 1 < 0.35) ? Math.floor(val) : (val % 1 < 0.9 ? Math.floor(val) + 0.5 : Math.floor(val) + 1));
        masterData.karigars[activeId][type].push(entry); saveData(); renderGold();
    }
    function addCashEntry() {
        const amt = parseFloat(document.getElementById('cashAmt').value); if(isNaN(amt)) return;
        let k = masterData.karigars[activeId]; if(!k.cash) k.cash = [];
        let lastBal = k.cash.length > 0 ? k.cash[k.cash.length - 1].bal : 0;
        k.cash.push({ date: document.getElementById('cashDate').value, part: document.getElementById('cashPart').value, amt: amt, bal: lastBal + amt });
        saveData(); renderCash();
    }
    function renderGold() { /* Your stable render code */ }
    function renderCash() { /* Your stable render code */ }
</script>
</body>
</html>
