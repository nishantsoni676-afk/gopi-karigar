<script type="module">
    // 1. Firebase SDK Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getFirestore, 
        doc, 
        setDoc, 
        getDoc, 
        enableIndexedDbPersistence 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 2. YOUR FIREBASE CONFIG (Replace with your actual keys)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "gopi-jewellers-erp.firebaseapp.com",
        projectId: "gopi-jewellers-erp",
        storageBucket: "gopi-jewellers-erp.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // 3. Initialize Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 4. ENABLE OFFLINE PERSISTENCE (Crucial for Shop Use)
    enableIndexedDbPersistence(db).catch((err) => {
        if (err.code == 'failed-precondition') {
            console.warn("Persistence failed: Multiple tabs open.");
        } else if (err.code == 'unimplemented') {
            console.warn("Persistence not available in this browser.");
        }
    });

    const SHOP_PASS = "1234";
    let masterData = { dailyEntries: [] }; 
    let currentId = ""; 
    let editingRef = null;

    // --- FIREBASE SYNC FUNCTIONS ---

    async function loadFromServer() {
        try {
            const docRef = doc(db, "shopData", "master");
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                masterData = docSnap.data();
                if(!masterData.dailyEntries) masterData.dailyEntries = [];
                currentId = localStorage.getItem('gopi_active_id') || Object.keys(masterData)[0] || "";
                refreshUI();
                document.getElementById('syncStatus').innerText = "☁ SYNCED";
            } else {
                console.log("No cloud data found. Starting fresh.");
            }
        } catch (e) {
            console.error("Load Error:", e);
            document.getElementById('syncStatus').innerText = "⚠ OFFLINE MODE";
        }
    }

    async function saveData() {
        try {
            // Saves to Local Cache immediately, then Cloud in background
            await setDoc(doc(db, "shopData", "master"), masterData);
            localStorage.setItem('gopi_active_id', currentId);
            document.getElementById('syncStatus').innerText = "☁ SYNCED";
        } catch (e) {
            console.error("Save Error:", e);
            document.getElementById('syncStatus').innerText = "⚠ SAVED LOCALLY";
        }
    }

    // --- YOUR APP LOGIC (Restored & Verified) ---

    function getToday() { return new Date().toLocaleDateString('en-GB'); }
    function setDates() { ['drDate', 'crDate', 'cashDate', 'dailyDate'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = getToday(); }); }

    window.onload = () => {
        const savedLogo = localStorage.getItem('shopLogo');
        if(savedLogo) { document.getElementById('shopLogo').src = savedLogo; document.querySelectorAll('.shopLogoSmall').forEach(img => img.src = savedLogo); }
    };

    window.uploadLogo = function(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { 
                document.getElementById('shopLogo').src = e.target.result; 
                document.querySelectorAll('.shopLogoSmall').forEach(img => img.src = e.target.result); 
                localStorage.setItem('shopLogo', e.target.result); 
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    window.checkPass = function() { 
        if(document.getElementById('passInput').value === SHOP_PASS) { 
            openModule('main-menu'); 
            loadFromServer(); 
        } else alert("Wrong Password!"); 
    }

    window.openModule = function(id) { 
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); 
        document.getElementById(id).classList.add('active'); 
        setDates(); 
        refreshUI(); 
    }

    window.registerKarigar = function() { 
        const n = document.getElementById('newName').value; 
        if(!n) return; 
        const id = "K_"+Date.now(); 
        masterData[id]={name:n, phone:document.getElementById('newPhone').value||'N/A', address:document.getElementById('newAddress').value||'N/A', dr:[], cr:[], cash:[]}; 
        currentId=id; 
        saveData(); 
        hideModal(); 
        refreshUI(); 
    }

    window.addEntry = function(type) {
        const wtVal = document.getElementById(type + 'Wt').value; if (!wtVal) return;
        let entry = { date: document.getElementById(type + 'Date').value || getToday(), saman: document.getElementById(type + 'Saman').value || "Gold", wt: parseFloat(wtVal) };
        if (type === 'cr') {
            const manualNet = parseFloat(document.getElementById('crNet').value);
            if (!isNaN(manualNet)) { entry.rounded = manualNet; } 
            else { let wt = entry.wt; let d = parseFloat((wt - Math.floor(wt)).toFixed(2)); entry.rounded = (wt < 1) ? 0 : (d < 0.35 ? Math.floor(wt) : (d < 0.9 ? Math.floor(wt) + 0.5 : Math.floor(wt) + 1)); }
            document.getElementById('crNet').value = '';
        }
        masterData[currentId][type].push(entry); saveData(); renderTable(); document.getElementById(type + 'Wt').value = ''; document.getElementById(type + 'Saman').value = ''; setDates();
    }

    window.calculate = function() {
        let k = masterData[currentId]; if(!k) return;
        let r = parseFloat(document.getElementById('rate').value) || 0;
        const tDr = k.dr.reduce((s, i) => s + i.wt, 0), tCr = k.cr.reduce((s, i) => s + i.wt, 0), tNet = k.cr.reduce((s, i) => s + (i.rounded || 0), 0);
        const netBal = tDr - tCr;
        const fine = ((tNet * 0.05) * 0.91) - netBal;
        document.getElementById('dispDr').innerText = tDr.toFixed(3); document.getElementById('dispCr').innerText = tCr.toFixed(3);
        document.getElementById('dispTotalNet').innerText = tNet.toFixed(1); document.getElementById('dispBal').innerText = netBal.toFixed(3);
        document.getElementById('dispFine').innerText = fine.toFixed(5);
        document.getElementById('dispRs').innerText = "₹" + Math.abs(Math.round(fine * r)).toLocaleString('en-IN');
    }

    window.renderTable = function() {
        document.getElementById('ledgerHeader').innerHTML = `<tr><th colspan="3" style="color:var(--debit-red)">DR - ISSUE</th><th colspan="4" style="color:var(--credit-green)">CR - JAMA</th></tr><tr><th>Date</th><th>Saman</th><th>Wt</th><th>Date</th><th>Saman</th><th>Wt</th><th>Net</th></tr>`;
        const body = document.getElementById('ledgerBody'); body.innerHTML = '';
        let k = masterData[currentId]; if(!k) return;
        document.getElementById('dispPhone').innerText = k.phone; document.getElementById('dispAddress').innerText = k.address;
        const rows = Math.max(k.dr.length, k.cr.length);
        for (let i = 0; i < rows; i++) {
            const dr = k.dr[i], cr = k.cr[i];
            body.innerHTML += `<tr><td>${dr?dr.date:'-'}</td><td>${dr?dr.saman:'-'}</td><td style="background:#fffafa;">${dr?dr.wt.toFixed(3):'-'}<br>${dr?`<button class="btn-edit-row" onclick="openEdit('dr', ${i})">✍</button><button class="btn-del-row" onclick="deleteRow('dr', ${i})">x</button>`:''}</td><td>${cr?cr.date:'-'}</td><td>${cr?cr.saman:'-'}</td><td style="background:#fafffa;">${cr?cr.wt.toFixed(3):'-'}<br>${cr?`<button class="btn-edit-row" onclick="openEdit('cr', ${i})">✍</button><button class="btn-del-row" onclick="deleteRow('cr', ${i})">x</button>`:''}</td><td>${cr?cr.rounded.toFixed(1):'-'}</td></tr>`;
        }
        calculate();
    }

    window.addCashEntry = function() {
        const amtVal = document.getElementById('cashAmt').value; if(!amtVal) return;
        if(!masterData[currentId].cash) masterData[currentId].cash = [];
        masterData[currentId].cash.push({ date: document.getElementById('cashDate').value || getToday(), part: document.getElementById('cashPart').value || "Cash", type: document.getElementById('cashType').value, amt: parseFloat(amtVal) });
        saveData(); renderCashTable(); document.getElementById('cashAmt').value = ''; document.getElementById('cashPart').value = ''; setDates();
    }

    window.renderCashTable = function() {
        const body = document.getElementById('cashTableBody'); body.innerHTML = '<thead><tr><th>Date</th><th>Part</th><th>Paid</th><th>Recd</th><th>Bal</th><th>X</th></tr></thead>';
        let k = masterData[currentId]; if(!k || !k.cash) return;
        let bal = 0; k.cash.forEach((c, idx) => {
            let p = c.type === 'Paid' ? c.amt : 0; let r = c.type === 'Recd' ? c.amt : 0; bal += (p - r);
            body.innerHTML += `<tr><td>${c.date}</td><td>${c.part}</td><td style="color:red;">${p||'-'}</td><td style="color:green;">${r||'-'}</td><td>₹${bal}</td><td><button class="btn-edit-row" onclick="openEdit('cash', ${idx})">✍</button><button class="btn-del-row" onclick="deleteCash(${idx})">x</button></td></tr>`;
        });
        document.getElementById('dispCashBal').innerText = "₹" + bal;
    }

    window.addDailyEntry = function() {
        const amt = parseFloat(document.getElementById('dailyAmt').value); if(isNaN(amt)) return;
        masterData.dailyEntries.push({ date: document.getElementById('dailyDate').value || getToday(), part: document.getElementById('dailyPart').value || "General", type: document.getElementById('dailyType').value, amt: amt });
        saveData(); renderDailyTable(); document.getElementById('dailyAmt').value = ''; document.getElementById('dailyPart').value = ''; setDates();
    }

    window.renderDailyTable = function() {
        const body = document.getElementById('dailyTableBody'); body.innerHTML = ''; let bal = 0;
        masterData.dailyEntries.forEach((e, idx) => {
            let i = e.type === 'In' ? e.amt : 0; let o = e.type === 'Out' ? e.amt : 0; bal += (i - o);
            body.innerHTML += `<tr><td>${e.date}</td><td>${e.part}</td><td style="color:green;">${i||'-'}</td><td style="color:red;">${o||'-'}</td><td>₹${bal}</td><td><button class="btn-del-row" onclick="deleteDaily(${idx})">x</button></td></tr>`;
        });
        document.getElementById('dispDailyBal').innerText = "₹" + bal;
    }

    window.openEdit = function(module, index) {
        editingRef = { module, index }; const entry = masterData[currentId][module][index];
        document.getElementById('editDate').value = entry.date;
        document.getElementById('editSaman').value = module === 'cash' ? entry.part : entry.saman;
        document.getElementById('editVal').value = module === 'cash' ? entry.amt : entry.wt;
        document.getElementById('netEditSection').style.display = (module === 'cr') ? 'block' : 'none';
        if(module === 'cr') document.getElementById('editNet').value = entry.rounded;
        document.getElementById('editTypeSection').style.display = (module === 'cash') ? 'block' : 'none';
        if(module === 'cash') document.getElementById('editCashType').value = entry.type;
        document.getElementById('editModal').style.display = 'flex';
    }

    window.saveEdit = function() {
        const { module, index } = editingRef; const entry = masterData[currentId][module][index];
        entry.date = document.getElementById('editDate').value; const val = parseFloat(document.getElementById('editVal').value);
        if(module === 'cash') { entry.part = document.getElementById('editSaman').value; entry.amt = val; entry.type = document.getElementById('editCashType').value; }
        else { entry.saman = document.getElementById('editSaman').value; entry.wt = val; if(module === 'cr') entry.rounded = parseFloat(document.getElementById('editNet').value) || entry.rounded; }
        saveData(); hideEditModal(); refreshUI();
    }

    window.deleteKarigar = function() {
        const pass = prompt("Enter Password to Delete Profile:");
        if (pass === SHOP_PASS) {
            if (confirm("Are you sure? All data for this Karigar will be lost forever.")) {
                delete masterData[currentId]; currentId = Object.keys(masterData)[0] || ""; saveData(); refreshUI(); openModule('main-menu');
            }
        } else if (pass !== null) alert("Incorrect Password!");
    }

    // --- UTILITY REFRESHERS ---
    function refreshUI() {
        const selG = document.getElementById('karigarSelector'), selC = document.getElementById('cashKarigarSelector');
        if(selG) { selG.innerHTML = ''; Object.keys(masterData).forEach(id => { if(id !== 'dailyEntries') selG.innerHTML += `<option value="${id}" ${id === currentId ? 'selected' : ''}>${masterData[id].name}</option>`; }); }
        if(selC) { selC.innerHTML = ''; Object.keys(masterData).forEach(id => { if(id !== 'dailyEntries') selC.innerHTML += `<option value="${id}" ${id === currentId ? 'selected' : ''}>${masterData[id].name}</option>`; }); }
        renderTable(); renderCashTable(); renderDailyTable();
    }
    window.switchKarigar = () => { currentId = document.getElementById('karigarSelector').value; refreshUI(); };
    window.switchCashKarigar = () => { currentId = document.getElementById('cashKarigarSelector').value; refreshUI(); };

    // --- MODAL TRIGGERS ---
    window.showModal = () => document.getElementById('modal').style.display = 'flex';
    window.hideModal = () => document.getElementById('modal').style.display = 'none';
    window.hideEditModal = () => document.getElementById('editModal').style.display = 'none';

    // --- DELETION ---
    window.deleteRow = (t, i) => { if(confirm("Delete?")) { masterData[currentId][t].splice(i, 1); saveData(); renderTable(); } };
    window.deleteCash = (i) => { if(confirm("Delete?")) { masterData[currentId].cash.splice(i, 1); saveData(); renderCashTable(); } };
    window.deleteDaily = (i) => { if(confirm("Delete?")) { masterData.dailyEntries.splice(i, 1); saveData(); renderDailyTable(); } };

    // --- PDF GENERATORS ---
    window.generateDailyPDF = () => {
        const logo = localStorage.getItem('shopLogo') || ''; let bal = 0;
        let pdfHTML = `<div style="padding:20px; font-family:sans-serif; text-align:center;">${logo ? `<img src="${logo}" style="width:80px; height:80px; border-radius:50%;">` : ''}<h2 style="margin:5px 0; color:#d4af37;">GOPI JEWELLERS</h2><h3 style="color:#1a1a1a; margin-bottom:20px; border-bottom:2px solid #eee; padding-bottom:10px;">Daily Shop Cash Book Report</h3><table style="width:100%; border-collapse:collapse; font-size:12px;"><thead style="background:#f4f4f4;"><tr><th style="border:1px solid #ddd; padding:8px;">Date</th><th style="border:1px solid #ddd; padding:8px;">Description</th><th style="border:1px solid #ddd; padding:8px;">Cash In (+)</th><th style="border:1px solid #ddd; padding:8px;">Cash Out (-)</th><th style="border:1px solid #ddd; padding:8px;">Balance</th></tr></thead><tbody>`;
        masterData.dailyEntries.forEach(e => { let i = e.type === 'In' ? e.amt : 0; let o = e.type === 'Out' ? e.amt : 0; bal += (i - o); pdfHTML += `<tr><td style="border:1px solid #ddd; padding:8px;">${e.date}</td><td style="border:1px solid #ddd; padding:8px;">${e.part}</td><td style="border:1px solid #ddd; padding:8px; color:green;">${i||'-'}</td><td style="border:1px solid #ddd; padding:8px; color:red;">${o||'-'}</td><td style="border:1px solid #ddd; padding:8px; font-weight:bold;">₹${bal}</td></tr>`; });
        pdfHTML += `</tbody></table><div style="margin-top:20px; text-align:right; font-size:16px; border-top:2px solid #d4af37; padding-top:10px;"><b>Final Shop Balance: ₹${bal}</b></div></div>`;
        html2pdf().from(pdfHTML).set({ margin: 10, filename: `Shop_Daily_Cash.pdf` }).save();
    }

    window.generatePDF = () => {
        const k = masterData[currentId]; if(!k) return;
        const logo = localStorage.getItem('shopLogo') || '';
        let pdfHTML = `<div style="padding:20px; font-family:sans-serif; text-align:center;">${logo ? `<img src="${logo}" style="width:80px; height:80px; border-radius:50%;">` : ''}<h2 style="margin:5px 0; color:#d4af37;">GOPI JEWELLERS</h2><div style="margin-bottom:20px; border-bottom:2px solid #eee; padding-bottom:10px;"><b>Karigar:</b> ${k.name} | <b>Phone:</b> ${k.phone} <br> <b>Address:</b> ${k.address}</div><table style="width:100%; border-collapse:collapse; font-size:11px;"><thead style="background:#f4f4f4;"><tr><th colspan="3" style="border:1px solid #ddd; padding:8px;">DR - ISSUE</th><th colspan="4" style="border:1px solid #ddd; padding:8px;">CR - JAMA</th></tr><tr><th style="border:1px solid #ddd; padding:5px;">Date</th><th style="border:1px solid #ddd; padding:5px;">Saman</th><th style="border:1px solid #ddd; padding:5px;">Wt</th><th style="border:1px solid #ddd; padding:5px;">Date</th><th style="border:1px solid #ddd; padding:5px;">Saman</th><th style="border:1px solid #ddd; padding:5px;">Wt</th><th style="border:1px solid #ddd; padding:5px;">Net</th></tr></thead><tbody>`;
        const rows = Math.max(k.dr.length, k.cr.length);
        for (let i = 0; i < rows; i++) { pdfHTML += `<tr><td style="border:1px solid #ddd; padding:5px;">${k.dr[i]?.date||'-'}</td><td style="border:1px solid #ddd; padding:5px;">${k.dr[i]?.saman||'-'}</td><td style="border:1px solid #ddd; padding:5px;">${k.dr[i]?.wt.toFixed(3)||'-'}</td><td style="border:1px solid #ddd; padding:5px;">${k.cr[i]?.date||'-'}</td><td style="border:1px solid #ddd; padding:5px;">${k.cr[i]?.saman||'-'}</td><td style="border:1px solid #ddd; padding:5px;">${k.cr[i]?.wt.toFixed(3)||'-'}</td><td style="border:1px solid #ddd; padding:5px; font-weight:bold;">${k.cr[i]?.rounded.toFixed(1)||'-'}</td></tr>`; }
        pdfHTML += `</tbody></table><div style="margin-top:20px; text-align:right; font-size:14px; border-top:2px solid #d4af37; padding-top:10px;"><b>Settlement: ${document.getElementById('dispRs').innerText}</b></div></div>`;
        html2pdf().from(pdfHTML).set({ margin: 10, filename: `${k.name}_Gold.pdf` }).save();
    }

    window.generateCashPDF = () => {
        const k = masterData[currentId]; if(!k) return;
        const logo = localStorage.getItem('shopLogo') || ''; let bal = 0;
        let pdfHTML = `<div style="padding:20px; font-family:sans-serif; text-align:center;">${logo ? `<img src="${logo}" style="width:80px; height:80px; border-radius:50%;">` : ''}<h2 style="margin:5px 0; color:#1e3a8a;">GOPI JEWELLERS</h2><div style="margin-bottom:20px; border-bottom:2px solid #eee; padding-bottom:10px;"><b>Karigar:</b> ${k.name} | <b>Phone:</b> ${k.phone}</div><table style="width:100%; border-collapse:collapse; font-size:12px;"><thead style="background:#f4f4f4;"><tr><th>Date</th><th>Particular</th><th>Paid</th><th>Recd</th><th>Balance</th></tr></thead><tbody>`;
        k.cash.forEach(c => { let p = c.type === 'Paid' ? c.amt : 0; let r = c.type === 'Recd' ? c.amt : 0; bal += (p - r); pdfHTML += `<tr><td style="border:1px solid #ddd; padding:8px;">${c.date}</td><td style="border:1px solid #ddd; padding:8px;">${c.part}</td><td style="color:red; border:1px solid #ddd;">${p||'-'}</td><td style="color:green; border:1px solid #ddd;">${r||'-'}</td><td style="font-weight:bold; border:1px solid #ddd;">₹${bal}</td></tr>`; });
        pdfHTML += `</tbody></table><div style="margin-top:20px; text-align:right; font-size:16px;"><b>Final: ₹${bal}</b></div></div>`;
        html2pdf().from(pdfHTML).set({ margin: 10, filename: `${k.name}_Cash.pdf` }).save();
    }

</script>
</body>
</html>
