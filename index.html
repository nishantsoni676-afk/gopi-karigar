<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gopi Jewellers ERP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --debit-red: #e74c3c; --credit-green: #27ae60; --navy: #1e3a8a; }
        html, body { height: 100%; margin: 0; padding: 0; background: #f0f2f5; font-family: -apple-system, sans-serif; }
        .container { background: white; width: 100%; min-height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        .page { display: none; flex-direction: column; padding: 10px; box-sizing: border-box; min-height: 100vh; }
        .page.active { display: flex; }
        .header { text-align: center; border-bottom: 3px solid var(--gold); padding-bottom: 8px; margin-bottom: 12px; }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 25px; flex-grow: 1; align-content: center; }
        .menu-card { background: var(--dark); color: white; padding: 40px 20px; border-radius: 15px; text-align: center; border: 3px solid var(--gold); cursor: pointer; }
        .menu-card h2 { margin: 10px 0 0; font-size: 24px; text-transform: uppercase; font-weight: 900; }
        input, select, .btn-nav { width: 100%; padding: 15px; border-radius: 8px; border: 2px solid #ccc; font-weight: bold; margin-bottom: 8px; font-size: 16px; box-sizing: border-box; }
        .btn-nav { background: var(--gold); color: var(--dark); text-transform: uppercase; border: none; cursor: pointer; }
        .btn-footer { width: 100%; padding: 20px; border: none; border-radius: 10px; font-weight: 900; color: white; margin-top: 10px; font-size: 20px; cursor: pointer; }
        .input-card { padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 2px solid #ddd; }
        .dr-card { border-left: 10px solid var(--debit-red); background: #fffafa; }
        .cr-card { border-left: 10px solid var(--credit-green); background: #fafffa; }
        .table-wrap { flex-grow: 1; min-height: 350px; overflow: auto; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; background: white; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; font-size: 14px; font-weight: bold; }
        th { position: sticky; top: 0; background: #eee; z-index: 10; border-bottom: 2px solid #ddd; padding: 10px; }
        td { padding: 10px; text-align: center; border: 1px solid #ddd; }
        .btn-del-row { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; margin: 2px; }
        .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
        .stat-card { background: var(--dark); color: white; padding: 12px; border-radius: 8px; text-align: center; }
        .stat-card div { font-size: 20px; font-weight: 900; color: var(--gold); }
        .full-width-card { grid-column: span 2; padding: 15px; border: 2px solid var(--gold); }
        .amount-card { background: var(--navy); border: 3px solid var(--gold); }
        .profile-info { background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ddd; font-size: 14px; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="page active" style="justify-content: center; align-items: center; text-align: center;">
        <div onclick="document.getElementById('logoInput').click()" style="cursor:pointer">
            <img id="shopLogo" src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:120px; height:120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); margin-bottom: 20px;">
        </div>
        <input type="file" id="logoInput" accept="image/*" style="display:none" onchange="uploadLogo(this)">
        <h1>Gopi Jewellers</h1>
        <input type="password" id="passInput" placeholder="Password" style="text-align:center; width: 80%;">
        <button class="btn-footer" style="background:var(--gold); color:var(--dark); width: 80%;" onclick="checkPass()">LOGIN</button>
    </div>

    <div id="main-menu" class="page">
        <div class="header"><h2>Control Panel</h2></div>
        <div class="menu-grid">
            <div class="menu-card" onclick="openModule('jobwork-page')">⚖️<h2>Karigar Jobwork</h2></div>
            <div class="menu-card" onclick="openModule('cash-page')">💸<h2>Karigar Cash</h2></div>
        </div>
    </div>

    <div id="jobwork-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding: 10px; font-size: 14px;" onclick="openModule('main-menu')">← BACK TO MENU</button>
        <div class="header">
            <img class="shopLogoSmall" src="" style="width:50px; height:50px; border-radius:50%; vertical-align: middle;">
            <div id="syncStatus" style="font-size:12px; color:#888; font-weight:900;">☁ CONNECTED</div>
        </div>
        <select id="karigarSelector" onchange="switchKarigar()"></select>
        <div id="profileDetails" class="profile-info"><b>Phone:</b> <span id="dispPhone">-</span> | <b>Address:</b> <span id="dispAddress">-</span></div>
        <button class="btn-nav" onclick="showModal()">+ NEW REGISTRATION</button>
        <button class="btn-nav" style="background:#2c3e50; color:white;" onclick="generatePDF()">📄 DOWNLOAD GOLD SLIP</button>

        <div class="input-card dr-card">
            <div style="display:flex; gap:5px;"><input type="text" id="drDate" style="width:35%;"><input type="text" id="drSaman" placeholder="Saman"><input type="number" id="drWt" step="0.001" placeholder="Wt"></div>
            <button class="btn-footer" style="background:var(--debit-red);" onclick="addEntry('dr')">ADD ISSUE (DR)</button>
        </div>
        <div class="input-card cr-card">
            <div style="display:flex; gap:5px;"><input type="text" id="crDate" style="width:35%;"><input type="text" id="crSaman" placeholder="Saman"></div>
            <div style="display:flex; gap:5px; margin-top:5px;"><input type="number" id="crWt" step="0.001" placeholder="Wt"><input type="number" id="crNet" step="0.1" placeholder="Net (Optional)"></div>
            <button class="btn-footer" style="background:var(--credit-green);" onclick="addEntry('cr')">ADD JAMA (CR)</button>
        </div>
        <input type="number" id="rate" oninput="calculate()" placeholder="₹ Gold Rate">
        <div class="table-wrap"><table><thead id="ledgerHeader"></thead><tbody id="ledgerBody"></tbody></table></div>
        <div class="summary">
            <div class="stat-card"><small>TOTAL DR</small><div id="dispDr">0.000</div></div>
            <div class="stat-card"><small>TOTAL CR</small><div id="dispCr">0.000</div></div>
            <div class="stat-card"><small>TOTAL NET</small><div id="dispTotalNet">0.0</div></div>
            <div class="stat-card"><small>BALANCE</small><div id="dispBal">0.000</div></div>
            <div class="stat-card full-width-card amount-card"><small>SETTLEMENT AMOUNT</small><div id="dispRs">₹0</div></div>
        </div>
        <button class="btn-footer" style="background:#e74c3c; margin-bottom:30px;" onclick="deleteKarigar()">DELETE PROFILE</button>
    </div>

    <div id="cash-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding: 10px; font-size: 14px;" onclick="openModule('main-menu')">← BACK TO MENU</button>
        <div class="header"><h2>Karigar Cash</h2></div>
        <select id="cashKarigarSelector" onchange="switchCashKarigar()"></select>
        <button class="btn-nav" style="background:#2c3e50; color:white;" onclick="generateCashPDF()">📄 DOWNLOAD CASH SLIP</button>
        <div class="input-card">
            <div style="display:flex; gap:5px;"><input type="text" id="cashDate" style="width:35%;"><input type="text" id="cashPart" placeholder="Particular"></div>
            <div style="display:flex; gap:5px; margin-top:5px;"><input type="number" id="cashAmt" placeholder="Amount ₹"><select id="cashType" style="width:40%;"><option value="Paid">PAID</option><option value="Recd">RECD</option></select></div>
            <button class="btn-footer" style="background:var(--navy);" onclick="addCashEntry()">SAVE CASH ENTRY</button>
        </div>
        <div class="table-wrap"><table><tbody id="cashTableBody"></tbody></table></div>
        <div class="summary"><div class="stat-card full-width-card amount-card"><small>CASH BALANCE</small><div id="dispCashBal">₹0</div></div></div>
    </div>
</div>

<div id="modal"><div style="background:white; padding:25px; border-radius:12px; width:90%; max-width:400px; text-align:center;"><h2>Register</h2><input type="text" id="newName" placeholder="Name"><input type="tel" id="newPhone" placeholder="Phone"><input type="text" id="newAddress" placeholder="Address"><button class="btn-footer" style="background:var(--credit-green);" onclick="registerKarigar()">SAVE</button><button class="btn-footer" style="background:#999;" onclick="hideModal()">CANCEL</button></div></div>

<script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbx0G79ae_2xJR8kBKE2CxjL_62qOUv0_BqzzmTN5YhopZ61XTg0F499a8QvQ3cTpGjcXw/exec";
    const SHOP_PASS = "1234";
    let masterData = {}; let currentId = "";

    function getToday() { return new Date().toLocaleDateString('en-GB'); }
    function setDates() { ['drDate', 'crDate', 'cashDate'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = getToday(); }); }

    window.onload = () => {
        const savedLogo = localStorage.getItem('shopLogo');
        if(savedLogo) { document.getElementById('shopLogo').src = savedLogo; document.querySelectorAll('.shopLogoSmall').forEach(img => img.src = savedLogo); }
    };

    function uploadLogo(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('shopLogo').src = e.target.result; document.querySelectorAll('.shopLogoSmall').forEach(img => img.src = e.target.result); localStorage.setItem('shopLogo', e.target.result); };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function checkPass() { if(document.getElementById('passInput').value === SHOP_PASS) { openModule('main-menu'); loadFromServer(); } else alert("Wrong Password!"); }
    function openModule(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); setDates(); refreshUI(); }
    
    async function loadFromServer() {
        try { const r = await fetch(CLOUD_URL); const t = await r.text(); masterData = t.trim() ? JSON.parse(t) : {}; currentId = localStorage.getItem('gopi_active_id') || Object.keys(masterData)[0] || ""; refreshUI(); }
        catch (e) { masterData = JSON.parse(localStorage.getItem('gopi_master_cloud')) || {}; refreshUI(); }
    }

    function saveData() { localStorage.setItem('gopi_master_cloud', JSON.stringify(masterData)); localStorage.setItem('gopi_active_id', currentId); fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(masterData) }); }

    function registerKarigar() {
        const name = document.getElementById('newName').value; if (!name) return;
        const id = "K_"+Date.now(); masterData[id]={name, phone: document.getElementById('newPhone').value || 'N/A', address: document.getElementById('newAddress').value || 'N/A', dr:[], cr:[], cash:[]};
        currentId=id; saveData(); hideModal(); refreshUI();
    }

    function addEntry(type) {
        const wtVal = document.getElementById(type + 'Wt').value; if (!wtVal) return;
        let entry = { date: document.getElementById(type + 'Date').value || getToday(), saman: document.getElementById(type + 'Saman').value || "Gold", wt: parseFloat(wtVal) };
        if (type === 'cr') {
            const manualNet = parseFloat(document.getElementById('crNet').value);
            if (!isNaN(manualNet)) { entry.rounded = manualNet; } 
            else { let wt = entry.wt; let d = parseFloat((wt - Math.floor(wt)).toFixed(2)); entry.rounded = (wt < 1) ? 0 : (d < 0.35 ? Math.floor(wt) : (d < 0.9 ? Math.floor(wt) + 0.5 : Math.floor(wt) + 1)); }
            document.getElementById('crNet').value = '';
        }
        masterData[currentId][type].push(entry); saveData(); renderTable(); document.getElementById(type + 'Wt').value = ''; document.getElementById(type + 'Saman').value = ''; setDates();
    }

    function addCashEntry() {
        const amtVal = document.getElementById('cashAmt').value; if(!amtVal) return;
        if(!masterData[currentId].cash) masterData[currentId].cash = [];
        masterData[currentId].cash.push({ date: document.getElementById('cashDate').value || getToday(), part: document.getElementById('cashPart').value || "Cash", type: document.getElementById('cashType').value, amt: parseFloat(amtVal) });
        saveData(); renderCashTable(); document.getElementById('cashAmt').value = ''; document.getElementById('cashPart').value = ''; setDates();
    }

    function calculate() {
        let k = masterData[currentId]; if(!k) return;
        let r = parseFloat(document.getElementById('rate').value) || 0;
        const tDr = k.dr.reduce((s, i) => s + i.wt, 0), tCr = k.cr.reduce((s, i) => s + i.wt, 0), tNet = k.cr.reduce((s, i) => s + (i.rounded || 0), 0);
        const fine = ((tNet * 0.05) - (tDr - tCr)) * 0.91;
        document.getElementById('dispDr').innerText = tDr.toFixed(3); document.getElementById('dispCr').innerText = tCr.toFixed(3);
        document.getElementById('dispTotalNet').innerText = tNet.toFixed(1); document.getElementById('dispBal').innerText = (tDr - tCr).toFixed(3);
        document.getElementById('dispRs').innerText = "₹" + Math.abs(Math.round(fine * r)).toLocaleString('en-IN');
    }

    function renderTable() {
        document.getElementById('ledgerHeader').innerHTML = `<tr><th colspan="3">DR - ISSUE</th><th colspan="4">CR - JAMA</th></tr><tr><th>Date</th><th>Saman</th><th>Wt</th><th>Date</th><th>Saman</th><th>Wt</th><th>Net</th></tr>`;
        const body = document.getElementById('ledgerBody'); body.innerHTML = '';
        let k = masterData[currentId]; if(!k) return;
        document.getElementById('dispPhone').innerText = k.phone; document.getElementById('dispAddress').innerText = k.address;
        const rows = Math.max(k.dr.length, k.cr.length);
        for (let i = 0; i < rows; i++) {
            body.innerHTML += `<tr><td>${k.dr[i]?.date||'-'}</td><td>${k.dr[i]?.saman||'-'}</td><td>${k.dr[i]?k.dr[i].wt.toFixed(3):'-'} ${k.dr[i]?`<button class="btn-del-row" onclick="deleteRow('dr', ${i})">x</button>`:''}</td><td>${k.cr[i]?.date||'-'}</td><td>${k.cr[i]?.saman||'-'}</td><td>${k.cr[i]?k.cr[i].wt.toFixed(3):'-'} ${k.cr[i]?`<button class="btn-del-row" onclick="deleteRow('cr', ${i})">x</button>`:''}</td><td>${k.cr[i]?k.cr[i].rounded.toFixed(1):'-'}</td></tr>`;
        }
        calculate();
    }

    function renderCashTable() {
        const body = document.getElementById('cashTableBody'); body.innerHTML = '<thead><tr><th>Date</th><th>Part</th><th>Paid</th><th>Recd</th><th>Bal</th><th>X</th></tr></thead>';
        let k = masterData[currentId]; if(!k || !k.cash) return;
        let bal = 0; k.cash.forEach((c, idx) => {
            let p = c.type === 'Paid' ? c.amt : 0; let r = c.type === 'Recd' ? c.amt : 0; bal += (p - r);
            body.innerHTML += `<tr><td>${c.date}</td><td>${c.part}</td><td style="color:red;">${p||'-'}</td><td style="color:green;">${r||'-'}</td><td>₹${bal}</td><td><button class="btn-del-row" onclick="deleteCash(${idx})">x</button></td></tr>`;
        });
        document.getElementById('dispCashBal').innerText = "₹" + bal;
    }

    function generatePDF() {
        const k = masterData[currentId]; if(!k) return;
        const logo = localStorage.getItem('shopLogo') || '';
        let pdfHTML = `<div style="padding:20px; font-family:sans-serif; text-align:center;">
            ${logo ? `<img src="${logo}" style="width:80px; height:80px; border-radius:50%;">` : ''}
            <h2 style="margin:5px 0; color:#d4af37;">GOPI JEWELLERS</h2>
            <div style="margin-bottom:20px; border-bottom:2px solid #eee; padding-bottom:10px;">
                <b>Karigar:</b> ${k.name} | <b>Phone:</b> ${k.phone} <br> <b>Address:</b> ${k.address}
            </div>
            <table style="width:100%; border-collapse:collapse; font-size:11px;">
                <thead style="background:#f4f4f4;"><tr><th colspan="3" style="border:1px solid #ddd; padding:8px;">DR - ISSUE</th><th colspan="4" style="border:1px solid #ddd; padding:8px;">CR - JAMA</th></tr>
                <tr><th style="border:1px solid #ddd; padding:5px;">Date</th><th style="border:1px solid #ddd; padding:5px;">Saman</th><th style="border:1px solid #ddd; padding:5px;">Wt</th><th style="border:1px solid #ddd; padding:5px;">Date</th><th style="border:1px solid #ddd; padding:5px;">Saman</th><th style="border:1px solid #ddd; padding:5px;">Wt</th><th style="border:1px solid #ddd; padding:5px;">Net</th></tr></thead>
                <tbody>`;
        const rows = Math.max(k.dr.length, k.cr.length);
        for (let i = 0; i < rows; i++) {
            pdfHTML += `<tr><td style="border:1px solid #ddd; padding:5px;">${k.dr[i]?.date||'-'}</td><td style="border:1px solid #ddd; padding:5px;">${k.dr[i]?.saman||'-'}</td><td style="border:1px solid #ddd; padding:5px;">${k.dr[i]?.wt.toFixed(3)||'-'}</td><td style="border:1px solid #ddd; padding:5px;">${k.cr[i]?.date||'-'}</td><td style="border:1px solid #ddd; padding:5px;">${k.cr[i]?.saman||'-'}</td><td style="border:1px solid #ddd; padding:5px;">${k.cr[i]?.wt.toFixed(3)||'-'}</td><td style="border:1px solid #ddd; padding:5px; font-weight:bold;">${k.cr[i]?.rounded.toFixed(1)||'-'}</td></tr>`;
        }
        pdfHTML += `</tbody></table>
            <div style="margin-top:20px; text-align:right; font-size:14px; border-top:2px solid #d4af37; padding-top:10px;">
                <b>Settlement Amount: ${document.getElementById('dispRs').innerText}</b>
            </div></div>`;
        html2pdf().from(pdfHTML).set({ margin: 10, filename: `${k.name}_Gold_Slip.pdf` }).save();
    }

    function generateCashPDF() {
        const k = masterData[currentId]; if(!k) return;
        const logo = localStorage.getItem('shopLogo') || '';
        let bal = 0;
        let pdfHTML = `<div style="padding:20px; font-family:sans-serif; text-align:center;">
            ${logo ? `<img src="${logo}" style="width:80px; height:80px; border-radius:50%;">` : ''}
            <h2 style="margin:5px 0; color:#1e3a8a;">GOPI JEWELLERS</h2>
            <div style="margin-bottom:20px; border-bottom:2px solid #eee; padding-bottom:10px;">
                <b>Karigar:</b> ${k.name} | <b>Phone:</b> ${k.phone}
            </div>
            <table style="width:100%; border-collapse:collapse; font-size:12px;">
                <thead style="background:#f4f4f4;"><tr><th style="border:1px solid #ddd; padding:8px;">Date</th><th style="border:1px solid #ddd; padding:8px;">Particular</th><th style="border:1px solid #ddd; padding:8px;">Paid (Out)</th><th style="border:1px solid #ddd; padding:8px;">Recd (In)</th><th style="border:1px solid #ddd; padding:8px;">Balance</th></tr></thead>
                <tbody>`;
        k.cash.forEach(c => {
            let p = c.type === 'Paid' ? c.amt : 0; let r = c.type === 'Recd' ? c.amt : 0; bal += (p - r);
            pdfHTML += `<tr><td style="border:1px solid #ddd; padding:8px;">${c.date}</td><td style="border:1px solid #ddd; padding:8px;">${c.part}</td><td style="border:1px solid #ddd; padding:8px; color:red;">${p||'-'}</td><td style="border:1px solid #ddd; padding:8px; color:green;">${r||'-'}</td><td style="border:1px solid #ddd; padding:8px; font-weight:bold;">₹${bal}</td></tr>`;
        });
        pdfHTML += `</tbody></table>
            <div style="margin-top:20px; text-align:right; font-size:16px; color:#1e3a8a;">
                <b>Final Balance: ₹${bal}</b>
            </div></div>`;
        html2pdf().from(pdfHTML).set({ margin: 10, filename: `${k.name}_Cash_Slip.pdf` }).save();
    }

    function refreshUI() {
        const selG = document.getElementById('karigarSelector'), selC = document.getElementById('cashKarigarSelector');
        selG.innerHTML = ''; selC.innerHTML = '';
        Object.keys(masterData).forEach(id => {
            const opt = `<option value="${id}" ${id === currentId ? 'selected' : ''}>${masterData[id].name}</option>`;
            selG.innerHTML += opt; selC.innerHTML += opt;
        });
        renderTable(); renderCashTable();
    }
    function switchKarigar() { currentId = document.getElementById('karigarSelector').value; refreshUI(); }
    function switchCashKarigar() { currentId = document.getElementById('cashKarigarSelector').value; refreshUI(); }
    function deleteRow(t, i) { if(confirm("Delete?")) { masterData[currentId][t].splice(i, 1); saveData(); renderTable(); } }
    function deleteCash(i) { if(confirm("Delete?")) { masterData[currentId].cash.splice(i, 1); saveData(); renderCashTable(); } }
    function deleteKarigar() { if(confirm("Delete Profile?")) { delete masterData[currentId]; currentId = Object.keys(masterData)[0] || ""; saveData(); refreshUI(); openModule('main-menu'); } }
    function showModal() { document.getElementById('modal').style.display = 'flex'; }
    function hideModal() { document.getElementById('modal').style.display = 'none'; }
</script>
</body>
</html>
