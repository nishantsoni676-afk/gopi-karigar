<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gopi Jewellers ERP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --debit-red: #e74c3c; --credit-green: #27ae60; --navy: #1e3a8a; }
        html, body { height: 100%; margin: 0; padding: 0; background: #f0f2f5; font-family: -apple-system, sans-serif; }
        .container { background: white; width: 100%; min-height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        .page { display: none; flex-direction: column; padding: 10px; box-sizing: border-box; min-height: 100vh; }
        .page.active { display: flex; }
        
        /* MENU PAGE */
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; padding: 25px; flex-grow: 1; align-content: center; }
        .menu-card { background: var(--dark); color: white; padding: 35px 20px; border-radius: 15px; text-align: center; border: 4px solid var(--gold); cursor: pointer; }
        .menu-card h2 { margin: 10px 0 0; font-size: 24px; text-transform: uppercase; font-weight: 900; }

        /* COMMON UI */
        .header { text-align: center; border-bottom: 3px solid var(--gold); padding-bottom: 8px; margin-bottom: 12px; }
        select, .btn-nav, .btn-footer { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }
        .btn-nav { background: var(--gold); color: var(--dark); text-transform: uppercase; margin-bottom: 8px; }
        .btn-footer { margin-top: 10px; color: white; text-transform: uppercase; }
        .input-card { padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 2px solid #ddd; }
        .dr-card { border-left: 10px solid var(--debit-red); background: #fffafa; }
        .cr-card { border-left: 10px solid var(--credit-green); background: #fafffa; }
        input { width: 100%; padding: 15px; border: 2px solid #ccc; border-radius: 6px; font-size: 18px; font-weight: bold; box-sizing: border-box; margin-top: 5px; }
        .table-wrap { flex-grow: 1; min-height: 400px; overflow: auto; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; font-size: 16px; font-weight: bold; }
        th { position: sticky; top: 0; background: #eee; z-index: 10; border-bottom: 3px solid #ddd; padding: 12px; }
        td { padding: 12px; text-align: center; border: 1px solid #ddd; }
        .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
        .stat-card { background: var(--dark); color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-card div { font-size: 22px; font-weight: 900; color: var(--gold); }
        .amount-card { background: var(--navy); border: 3px solid var(--gold); grid-column: span 2; }
        .amount-card div { font-size: 36px; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="page active" style="justify-content:center; align-items:center; text-align:center;">
        <img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:120px; margin-bottom: 20px;">
        <h1>Gopi Jewellers</h1>
        <input type="password" id="passInput" placeholder="Password" style="text-align:center; width: 80%;">
        <button class="btn-footer" style="background:var(--gold); color:var(--dark); width: 80%;" onclick="checkPass()">LOGIN</button>
    </div>

    <div id="main-menu" class="page">
        <div class="header"><h2>Master Dashboard</h2></div>
        <div class="menu-grid">
            <div class="menu-card" onclick="openModule('jobwork-page')">⚖️<h2>Karigar Jobwork</h2></div>
            <div class="menu-card" onclick="openModule('cash-page')">💸<h2>Karigar Cash</h2></div>
            <div class="menu-card" onclick="openModule('cust-page')" style="background:var(--navy);">👤<h2>Add Customer</h2></div>
            <div class="menu-card" onclick="openModule('sales-page')" style="background:#2c3e50;">🛍️<h2>Retail Sales</h2></div>
        </div>
    </div>

    <div id="jobwork-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding:10px; font-size:14px;" onclick="openModule('main-menu')">← BACK TO DASHBOARD</button>
        <div class="header"><img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:60px;"></div>
        <select id="karigarSelectorGold" onchange="switchKarigar(this.value)"></select>
        <button class="btn-nav" onclick="showModal()">+ REGISTER NEW KARIGAR</button>
        <button class="btn-nav" style="background:#2c3e50; color:white;" onclick="generateGoldPDF()">📄 DOWNLOAD GOLD SLIP</button>
        <div class="input-card dr-card">
            <div style="display:flex; gap:5px;"><input type="text" id="drDate" placeholder="Date"><input type="text" id="drSaman" placeholder="Saman"><input type="number" id="drWt" step="0.001" placeholder="Wt"></div>
            <button class="btn-footer" style="background:var(--debit-red);" onclick="addEntry('dr')">ADD ISSUE (DR)</button>
        </div>
        <div class="input-card cr-card">
            <div style="display:flex; gap:5px;"><input type="text" id="crDate" placeholder="Date"><input type="text" id="crSaman" placeholder="Saman"><input type="number" id="crWt" step="0.001" placeholder="Wt"></div>
            <button class="btn-footer" style="background:var(--credit-green);" onclick="addEntry('cr')">ADD JAMA (CR)</button>
        </div>
        <div style="padding:15px; background:#eee; border-radius:10px; display:flex; align-items:center; justify-content:space-between; border:1px solid #ccc;">
            <label style="font-size:18px; font-weight:900;">GOLD RATE:</label>
            <input type="number" id="rate" oninput="calculateGold()" placeholder="₹ Rate" style="width: 60%; margin-top:0;">
        </div>
        <div class="table-wrap"><table><tbody id="ledgerBodyGold"></tbody></table></div>
        <div class="summary">
            <div class="stat-card"><small>TOTAL DR</small><div id="dispDr">0.000</div></div>
            <div class="stat-card"><small>TOTAL CR</small><div id="dispCr">0.000</div></div>
            <div class="stat-card amount-card"><small>SETTLEMENT (91%)</small><div id="dispRs">₹0</div></div>
        </div>
    </div>

    <div id="cash-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding:10px; font-size:14px;" onclick="openModule('main-menu')">← BACK TO DASHBOARD</button>
        <div class="header"><h3>CASH LEDGER</h3></div>
        <select id="karigarSelectorCash" onchange="switchKarigar(this.value)"></select>
        <div class="input-card" style="border-left:10px solid var(--navy); background:#f9f9f9;">
            <div style="display:flex; gap:5px;"><input type="text" id="cashDate" placeholder="Date"><input type="text" id="cashPart" placeholder="Cash/GPay"><input type="number" id="cashAmt" placeholder="Amount"></div>
            <button class="btn-footer" style="background:var(--navy);" onclick="addCashEntry()">ADD CASH ENTRY</button>
        </div>
        <div class="table-wrap"><table><tbody id="ledgerBodyCash"></tbody></table></div>
        <div class="summary"><div class="stat-card amount-card" style="background:var(--dark);"><small>CURRENT BALANCE</small><div id="dispRsCash">₹0</div></div></div>
    </div>

    <div id="cust-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding:10px; font-size:14px;" onclick="openModule('main-menu')">← BACK TO DASHBOARD</button>
        <div class="header"><h3>Customer Management</h3></div>
        <div class="input-card">
            <input type="text" id="custName" placeholder="Customer Name">
            <input type="text" id="custPhone" placeholder="Phone Number">
            <button class="btn-footer" style="background:var(--credit-green);" onclick="addCustomer()">SAVE CUSTOMER</button>
        </div>
        <div class="table-wrap">
            <table><thead><tr><th>Name</th><th>Phone</th></tr></thead><tbody id="custList"></tbody></table>
        </div>
    </div>

    <div id="sales-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding:10px; font-size:14px;" onclick="openModule('main-menu')">← BACK TO DASHBOARD</button>
        <div class="header"><h3>Retail Sale</h3></div>
        <div class="input-card">
            <select id="salesCustSelect"><option value="">-- Choose Customer --</option></select>
            <input type="text" id="sItem" placeholder="Item Name">
            <div style="display:flex; gap:5px;">
                <input type="number" id="sWt" placeholder="Net Wt">
                <input type="number" id="sRate" placeholder="Gold Rate">
            </div>
            <button class="btn-footer" style="background:var(--credit-green);" onclick="saveSale()">GENERATE BILL</button>
        </div>
        <div class="table-wrap"><table><tbody id="salesList"></tbody></table></div>
    </div>
</div>

<div id="modal"><div style="background:white; padding:25px; border-radius:12px; width:95%; max-width:400px; text-align:center;">
    <h2>Register Karigar</h2><input type="text" id="newName" placeholder="Name">
    <button class="btn-footer" style="background:var(--credit-green);" onclick="registerKarigar()">SAVE</button>
    <button class="btn-footer" style="background:#999;" onclick="hideModal()">CANCEL</button>
</div></div>

<script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbx0G79ae_2xJR8kBKE2CxjL_62qOUv0_BqzzmTN5YhopZ61XTg0F499a8QvQ3cTpGjcXw/exec";
    const SHOP_PASS = "1234";
    let masterData = { karigars: {}, customers: {}, sales: [] };
    let activeId = "";

    function checkPass() { if(document.getElementById('passInput').value === SHOP_PASS) { openModule('main-menu'); loadFromServer(); } else alert("Wrong!"); }
    function openModule(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function showModal() { document.getElementById('modal').style.display = 'flex'; }
    function hideModal() { document.getElementById('modal').style.display = 'none'; }

    async function loadFromServer() {
        try {
            const resp = await fetch(CLOUD_URL);
            const text = await resp.text();
            const cloudData = text.trim() ? JSON.parse(text) : {};
            // Merge cloud data into our structure
            if(cloudData.karigars) masterData.karigars = cloudData.karigars;
            if(cloudData.customers) masterData.customers = cloudData.customers;
            if(cloudData.sales) masterData.sales = cloudData.sales;
            
            activeId = localStorage.getItem('gopi_active_id') || Object.keys(masterData.karigars)[0] || "";
            refreshAll();
        } catch (e) { masterData = JSON.parse(localStorage.getItem('gopi_master_cloud')) || masterData; refreshAll(); }
    }

    function saveData() {
        localStorage.setItem('gopi_master_cloud', JSON.stringify(masterData));
        fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(masterData) });
    }

    function refreshAll() {
        // Sync Karigar Selectors
        const selG = document.getElementById('karigarSelectorGold'), selC = document.getElementById('karigarSelectorCash');
        selG.innerHTML = ''; selC.innerHTML = '';
        Object.keys(masterData.karigars).forEach(id => {
            const opt = `<option value="${id}" ${id === activeId ? 'selected' : ''}>${masterData.karigars[id].name}</option>`;
            selG.innerHTML += opt; selC.innerHTML += opt;
        });

        // Sync Customer Selector in Sales
        const selCust = document.getElementById('salesCustSelect');
        selCust.innerHTML = '<option value="">-- Choose Customer --</option>';
        const custBody = document.getElementById('custList'); custBody.innerHTML = '';
        Object.keys(masterData.customers).forEach(id => {
            selCust.innerHTML += `<option value="${id}">${masterData.customers[id].name}</option>`;
            custBody.innerHTML += `<tr><td>${masterData.customers[id].name}</td><td>${masterData.customers[id].phone}</td></tr>`;
        });

        renderGold(); renderCash(); renderSales();
    }

    function switchKarigar(id) { activeId = id; localStorage.setItem('gopi_active_id', id); refreshAll(); }

    function registerKarigar() {
        const name = document.getElementById('newName').value; if(!name) return;
        const id = "K_" + Date.now();
        masterData.karigars[id] = { name, dr: [], cr: [], cash: [] };
        activeId = id; saveData(); hideModal(); refreshAll();
    }

    function addCustomer() {
        const name = document.getElementById('custName').value;
        const phone = document.getElementById('custPhone').value;
        if(!name) return alert("Enter Name");
        const id = "C_" + Date.now();
        masterData.customers[id] = { name, phone };
        saveData(); refreshAll();
        document.getElementById('custName').value = ''; document.getElementById('custPhone').value = '';
    }

    // --- LOGIC FOR BUTTONS (Restored Stable version) ---
    function addEntry(type) {
        const val = parseFloat(document.getElementById(type + 'Wt').value);
        if (isNaN(val)) return;
        let entry = { date: document.getElementById(type + 'Date').value, saman: document.getElementById(type + 'Saman').value, val: val };
        if (type === 'cr') entry.rounded = val < 1 ? 0 : ((val % 1 < 0.35) ? Math.floor(val) : (val % 1 < 0.9 ? Math.floor(val) + 0.5 : Math.floor(val) + 1));
        masterData.karigars[activeId][type].push(entry);
        saveData(); renderGold();
    }

    function addCashEntry() {
        const amt = parseFloat(document.getElementById('cashAmt').value); if(isNaN(amt)) return;
        let k = masterData.karigars[activeId];
        let lastBal = k.cash.length > 0 ? k.cash[k.cash.length - 1].bal : 0;
        k.cash.push({ date: document.getElementById('cashDate').value, part: document.getElementById('cashPart').value, amt: amt, bal: lastBal + amt });
        saveData(); renderCash();
    }

    function renderGold() {
        const body = document.getElementById('ledgerBodyGold'); body.innerHTML = '<thead><tr><th colspan="3">DR</th><th colspan="4">CR</th></tr></thead>';
        let k = masterData.karigars[activeId]; if(!k) return;
        const rows = Math.max(k.dr.length, k.cr.length);
        for (let i = 0; i < rows; i++) {
            const dr = k.dr[i], cr = k.cr[i];
            body.innerHTML += `<tr><td>${dr?dr.date:'-'}</td><td>${dr?dr.saman:'-'}</td><td>${dr?dr.val.toFixed(3):'-'}</td><td>${cr?cr.date:'-'}</td><td>${cr?cr.saman:'-'}</td><td>${cr?cr.val.toFixed(3):'-'}</td><td>${cr?cr.rounded.toFixed(1):'-'}</td></tr>`;
        }
        calculateGold();
    }

    function renderCash() {
        const body = document.getElementById('ledgerBodyCash'); body.innerHTML = '<thead><tr><th>Date</th><th>Part</th><th>Amt</th><th>Bal</th></tr></thead>';
        let k = masterData.karigars[activeId]; if(!k) return;
        k.cash.forEach(item => { body.innerHTML += `<tr><td>${item.date}</td><td>${item.part}</td><td>${item.amt}</td><td>${item.bal}</td></tr>`; });
        document.getElementById('dispRsCash').innerText = "₹" + (k.cash.length > 0 ? k.cash[k.cash.length - 1].bal.toLocaleString() : "0");
    }

    function calculateGold() {
        let k = masterData.karigars[activeId]; if(!k) return;
        let r = parseFloat(document.getElementById('rate').value)||0;
        const tDr = k.dr.reduce((s,i)=>s+i.val,0), tCr = k.cr.reduce((s,i)=>s+i.val,0), tNet = k.cr.reduce((s,i)=>s+(i.rounded||0),0);
        const fine = ((tNet*0.05)-(tDr-tCr))*0.91;
        document.getElementById('dispDr').innerText = tDr.toFixed(3);
        document.getElementById('dispCr').innerText = tCr.toFixed(3);
        document.getElementById('dispRs').innerText = "₹"+Math.abs(Math.round(fine*r)).toLocaleString('en-IN');
    }

    function renderSales() {
        const body = document.getElementById('salesList'); body.innerHTML = '<thead><tr><th>Date</th><th>Customer</th><th>Total</th></tr></thead>';
        masterData.sales.forEach(s => { body.innerHTML += `<tr><td>${s.date}</td><td>${s.cust}</td><td>₹${s.total}</td></tr>`; });
    }

    function saveSale() {
        const cId = document.getElementById('salesCustSelect').value;
        const wt = parseFloat(document.getElementById('sWt').value);
        const rate = parseFloat(document.getElementById('sRate').value);
        if(!cId || isNaN(wt)) return alert("Fill details");
        const total = Math.round(wt * rate);
        masterData.sales.push({ date: new Date().toLocaleDateString(), cust: masterData.customers[cId].name, total });
        saveData(); refreshAll();
    }
</script>
</body>
</html>
