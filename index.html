<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gopi Jewellers ERP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --navy: #1e3a8a; }
        
        html, body { height: 100%; margin: 0; padding: 0; background: #f0f2f5; font-family: -apple-system, sans-serif; }
        
        /* Main Navigation Wrapper */
        .container { background: white; width: 100%; min-height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        
        /* Header Styling */
        .header { text-align: center; border-bottom: 3px solid var(--gold); padding: 10px; background: white; }
        
        /* Dashboard / Menu Styling */
        .menu-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
            padding: 25px; 
            flex-grow: 1; 
            align-content: center;
        }

        .menu-card {
            background: var(--dark);
            color: white;
            padding: 40px 20px;
            border-radius: 15px;
            text-align: center;
            text-decoration: none;
            border: 3px solid var(--gold);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .menu-card:active { transform: scale(0.95); }
        .menu-card h2 { margin: 10px 0 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        .menu-card i { font-size: 40px; color: var(--gold); }

        /* Page Management */
        .page { display: none; padding: 10px; flex-direction: column; }
        .page.active { display: flex; }

        /* Shared Buttons */
        .btn-back { background: var(--navy); color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .btn-action { width: 100%; padding: 15px; border-radius: 8px; border: none; background: var(--gold); color: var(--dark); font-weight: 900; font-size: 16px; margin-top: 10px; cursor: pointer; }

        /* Standard Ledger Styles (From your previous working version) */
        .input-card { padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 2px solid #ddd; }
        .table-wrap { flex-grow: 1; min-height: 350px; overflow: auto; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; font-size: 13px; }
        th { background: #eee; padding: 10px; position: sticky; top: 0; }
        td { padding: 10px; text-align: center; border: 1px solid #eee; }

        /* Summary Boxes */
        .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat { background: var(--dark); color: white; padding: 12px; border-radius: 8px; text-align: center; }
        .stat div { color: var(--gold); font-size: 18px; font-weight: bold; }

        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="login-page" class="page active" style="justify-content: center; align-items: center; text-align: center;">
        <img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:100px; margin-bottom: 20px;">
        <h1>Gopi Jewellers</h1>
        <input type="password" id="passInput" placeholder="Password" style="width: 80%; padding: 15px; border-radius: 8px; border: 2px solid #ccc; text-align: center;">
        <button class="btn-action" style="width: 80%;" onclick="checkPass()">Login</button>
    </div>

    <div id="main-menu" class="page">
        <div class="header">
            <img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:60px;">
            <h2>Control Panel</h2>
        </div>
        <div class="menu-grid">
            <div class="menu-card" onclick="openModule('jobwork-page')">
                <span style="font-size: 40px;">⚖️</span>
                <h2>Karigar Jobwork</h2>
                <small>(Gold Ledger)</small>
            </div>
            <div class="menu-card" onclick="openModule('cash-page')">
                <span style="font-size: 40px;">💸</span>
                <h2>Karigar Cash</h2>
                <small>(Coming Soon)</small>
            </div>
        </div>
    </div>

    <div id="jobwork-page" class="page">
        <button class="btn-back" onclick="openModule('main-menu')">← Back to Menu</button>
        <div class="header"><h3>Karigar Jobwork</h3></div>
        
        <select id="karigarSelector" style="width:100%; padding:15px; margin:10px 0;" onchange="switchKarigar()"></select>
        
        <div class="input-card" style="border-left: 8px solid #e74c3c;">
            <div style="display:flex; gap:5px;"><input type="text" id="drDate" placeholder="Date"><input type="text" id="drSaman" placeholder="Saman"><input type="number" id="drWt" placeholder="Wt"></div>
            <button class="btn-action" style="background:#e74c3c; color:white;" onclick="addEntry('Dr')">Issue Gold (DR)</button>
        </div>

        <div class="input-card" style="border-left: 8px solid #27ae60;">
            <div style="display:flex; gap:5px;"><input type="text" id="crDate" placeholder="Date"><input type="text" id="crSaman" placeholder="Saman"><input type="number" id="crWt" placeholder="Wt"></div>
            <button class="btn-action" style="background:#27ae60; color:white;" onclick="addEntry('Cr')">Jama Gold (CR)</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead><tr><th colspan="3">DR ISSUE</th><th colspan="4">CR JAMA</th></tr><tr><th>Date</th><th>Saman</th><th>Wt</th><th>Date</th><th>Saman</th><th>Total</th><th>Net</th></tr></thead>
                <tbody id="ledgerBody"></tbody>
            </table>
        </div>

        <div class="summary">
            <div class="stat"><small>TOTAL DR</small><div id="dispDr">0.000</div></div>
            <div class="stat"><small>TOTAL CR</small><div id="dispCr">0.000</div></div>
            <div class="stat" style="grid-column: span 2; background: var(--navy);"><small>SETTLEMENT</small><div id="dispRs">₹0</div></div>
        </div>
    </div>

    <div id="cash-page" class="page">
        <button class="btn-back" onclick="openModule('main-menu')">← Back to Menu</button>
        <div style="text-align:center; margin-top:50px;">
            <span style="font-size: 60px;">💸</span>
            <h2>Cash Section</h2>
            <p>This module is currently under development.</p>
        </div>
    </div>

</div>

<script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbx0G79ae_2xJR8kBKE2CxjL_62qOUv0_BqzzmTN5YhopZ61XTg0F499a8QvQ3cTpGjcXw/exec";
    const SHOP_PASS = "1234";
    let masterData = {};

    function checkPass() {
        if(document.getElementById('passInput').value === SHOP_PASS) {
            openModule('main-menu');
            loadFromServer();
        } else { alert("Wrong Password!"); }
    }

    function openModule(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // Logic for Gold Ledger stays active
    async function loadFromServer() {
        try {
            const response = await fetch(CLOUD_URL);
            const text = await response.text();
            masterData = text.trim() ? JSON.parse(text) : {};
            refreshUI();
        } catch (err) { console.log("Offline or sync error"); }
    }

    // ... (rest of your entry and calculation functions go here to maintain ledger functionality)
    // Note: I've kept the UI structure clean so you can navigate between Jobwork and the Menu easily.
</script>
</body>
</html>
