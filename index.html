<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gopi Jewellers Cloud</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --debit-red: #e74c3c; --credit-green: #27ae60; --navy: #1e3a8a; }
        html, body { height: 100%; margin: 0; padding: 0; background: #f0f2f5; font-family: -apple-system, sans-serif; }
        .container { background: white; width: 100%; max-width: 600px; margin: auto; min-height: 100vh; display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; }
        .header { text-align: center; border-bottom: 3px solid var(--gold); padding-bottom: 10px; margin-bottom: 15px; }
        select, .btn-nav { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: 900; margin-bottom: 8px; font-size: 18px; cursor: pointer; }
        .btn-nav { background: var(--gold); color: var(--dark); text-transform: uppercase; }
        .input-card { padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 2px solid #ddd; }
        .dr-card { border-left: 10px solid var(--debit-red); background: #fffafa; }
        .cr-card { border-left: 10px solid var(--credit-green); background: #fafffa; }
        input { width: 100%; padding: 15px; border: 2px solid #ccc; border-radius: 6px; font-size: 18px; font-weight: bold; box-sizing: border-box; margin-top: 6px; }
        .table-wrap { flex-grow: 1; min-height: 450px; overflow-y: auto; overflow-x: auto; margin: 15px 0; border: 2px solid #ddd; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; font-size: 16px; font-weight: bold; }
        th { position: sticky; top: 0; background: #eee; z-index: 10; border-bottom: 3px solid #ddd; padding: 12px; font-size: 14px; }
        td { padding: 12px; text-align: center; border: 1px solid #eee; }
        .btn-del-row { background: #ff4d4d; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 16px; font-weight: bold; }
        .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; padding-bottom: 10px; }
        .stat-card { background: var(--dark); color: white; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-card small { font-size: 12px; color: #bbb; text-transform: uppercase; display: block; }
        .stat-card div { font-size: 22px; font-weight: bold; color: var(--gold); }
        .full-width-card { grid-column: span 2; padding: 20px; border: 3px solid var(--gold); background: var(--navy); }
        .full-width-card div { font-size: 36px; color: var(--gold); }
        .btn-footer { width: 100%; padding: 20px; border: none; border-radius: 10px; font-weight: 900; color: white; margin-top: 10px; font-size: 20px; cursor: pointer; }
        #login-screen { text-align: center; padding: 80px 20px; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="login-screen" class="container">
    <img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:120px; margin-bottom: 25px;">
    <h1>Gopi Jewellers</h1>
    <input type="password" id="passInput" placeholder="Enter Password" style="text-align:center;">
    <button class="btn-footer" style="background:var(--gold); color:var(--dark);" onclick="checkPass()">LOGIN</button>
</div>

<div id="app-content" class="container" style="display:none;">
    <div class="header">
        <img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:60px;">
        <div id="syncStatus" style="font-size:12px; color:#888; font-weight:bold;">☁ CLOUD ONLINE</div>
    </div>

    <select id="karigarSelector" onchange="switchKarigar(this.value)"></select>
    <button class="btn-nav" onclick="showModal()">+ REGISTER NEW KARIGAR</button>
    <button class="btn-nav" style="background:#2c3e50; color:white;" onclick="generatePDF()">📄 DOWNLOAD PDF SLIP</button>

    <div class="input-card dr-card">
        <div style="display:flex; gap:6px;">
            <input type="text" id="drDate" placeholder="Date">
            <input type="text" id="drSaman" placeholder="Saman">
            <input type="number" id="drWt" step="0.001" placeholder="Wt">
        </div>
        <button class="btn-footer" style="background:var(--debit-red);" onclick="addEntry('dr')">ADD ISSUE (DR)</button>
    </div>

    <div class="input-card cr-card">
        <div style="display:flex; gap:6px;">
            <input type="text" id="crDate" placeholder="Date">
            <input type="text" id="crSaman" placeholder="Saman">
            <input type="number" id="crWt" step="0.001" placeholder="Wt">
        </div>
        <button class="btn-footer" style="background:var(--credit-green);" onclick="addEntry('cr')">ADD JAMA (CR)</button>
    </div>

    <div style="padding:15px; background:#eee; border-radius:10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #ccc;">
        <label style="font-size:16px; font-weight:bold;">GOLD RATE:</label>
        <input type="number" id="rate" oninput="calculate()" placeholder="₹ Rate" style="width: 60%; margin-top: 0;">
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr><th colspan="3" style="color:var(--debit-red)">DR - ISSUE</th><th colspan="4" style="color:var(--credit-green)">CR - JAMA</th></tr>
                <tr><th>Date</th><th>Saman</th><th>Wt</th><th>Date</th><th>Saman</th><th>Total Cr</th><th>Net</th></tr>
            </thead>
            <tbody id="ledgerBody"></tbody>
        </table>
    </div>

    <div class="summary">
        <div class="stat-card"><small>TOTAL DR</small><div id="dispDr">0.000</div></div>
        <div class="stat-card"><small>TOTAL CR</small><div id="dispCr">0.000</div></div>
        <div id="dispBal" style="display:none;">0.000</div>
        <div class="stat-card full-width-card"><small>SETTLEMENT (91%)</small><div id="dispRs">₹0</div></div>
    </div>
    
    <button class="btn-footer" style="background:#e74c3c; margin-bottom: 20px;" onclick="deleteKarigar()">DELETE PROFILE</button>
</div>

<div id="modal">
    <div style="background:white; padding:30px; border-radius:15px; width:95%; max-width:450px; text-align:center;">
        <h2>Register Karigar</h2>
        <input type="text" id="newName" placeholder="Enter Name">
        <button class="btn-footer" style="background:var(--credit-green);" onclick="registerKarigar()">SAVE</button>
        <button class="btn-footer" style="background:#999;" onclick="hideModal()">CANCEL</button>
    </div>
</div>

<script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbx0G79ae_2xJR8kBKE2CxjL_62qOUv0_BqzzmTN5YhopZ61XTg0F499a8QvQ3cTpGjcXw/exec";
    const SHOP_PASS = "1234";
    let masterData = {};
    let activeId = "";

    function checkPass() {

            document.getElementById('app-content').style.display =
