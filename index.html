<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gopi Jewellers ERP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --debit-red: #e74c3c; --credit-green: #27ae60; --navy: #1e3a8a; }
        html, body { height: 100%; margin: 0; padding: 0; background: #f0f2f5; font-family: -apple-system, sans-serif; }
        .container { background: white; width: 100%; min-height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        
        /* PAGE MANAGEMENT */
        .page { display: none; flex-direction: column; padding: 10px; box-sizing: border-box; min-height: 100vh; }
        .page.active { display: flex; }
        
        /* MENU PAGE */
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 15px; flex-grow: 1; align-content: center; }
        .menu-card { background: var(--dark); color: white; padding: 30px 10px; border-radius: 12px; text-align: center; border: 3px solid var(--gold); cursor: pointer; }
        .menu-card h2 { margin: 8px 0 0; font-size: 18px; text-transform: uppercase; font-weight: 900; }

        /* COMMON UI */
        .header { text-align: center; border-bottom: 3px solid var(--gold); padding-bottom: 8px; margin-bottom: 12px; }
        select, .btn-nav, .btn-footer { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: 900; font-size: 16px; cursor: pointer; }
        .btn-nav { background: var(--gold); color: var(--dark); text-transform: uppercase; margin-bottom: 8px; }
        .btn-footer { margin-top: 10px; color: white; text-transform: uppercase; }
        
        .input-card { padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 2px solid #ddd; background: #f9f9f9; }
        input { width: 100%; padding: 12px; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; font-weight: bold; box-sizing: border-box; margin-top: 5px; }
        
        .table-wrap { flex-grow: 1; min-height: 350px; overflow: auto; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; background: white; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; font-size: 14px; font-weight: bold; }
        th { position: sticky; top: 0; background: #eee; z-index: 10; border-bottom: 2px solid #ddd; padding: 10px; }
        td { padding: 10px; text-align: center; border: 1px solid #ddd; }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="page active" style="justify-content:center; align-items:center; text-align:center;">
        <img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:100px; margin-bottom: 20px;">
        <h1>Gopi Jewellers</h1>
        <input type="password" id="passInput" placeholder="Password" style="text-align:center; width: 80%;">
        <button class="btn-footer" style="background:var(--gold); color:var(--dark); width: 80%;" onclick="checkPass()">LOGIN</button>
    </div>

    <div id="main-menu" class="page">
        <div class="header"><h2>Master Panel</h2></div>
        <div class="menu-grid">
            <div class="menu-card" onclick="openModule('jobwork-page')">⚖️<h2>Karigar Jobwork</h2></div>
            <div class="menu-card" onclick="openModule('cash-page')">💸<h2>Karigar Cash</h2></div>
            <div class="menu-card" onclick="openModule('cust-page')" style="background:var(--navy);">👤<h2>Add Customer</h2></div>
            <div class="menu-card" onclick="openModule('sales-page')" style="background:#2c3e50;">🛍️<h2>Retail Sales</h2></div>
        </div>
    </div>

    <div id="cust-page" class="page">
        <button class="btn-footer" style="background:var(--navy);" onclick="openModule('main-menu')">← BACK TO MENU</button>
        <div class="header"><h3>Customer Directory</h3></div>
        <div class="input-card">
            <input type="text" id="custName" placeholder="Full Name">
            <input type="text" id="custPhone" placeholder="Phone Number">
            <input type="text" id="custAddr" placeholder="City/Address">
            <button class="btn-footer" style="background:var(--credit-green);" onclick="registerCustomer()">SAVE CUSTOMER</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Name</th><th>Phone</th><th>Address</th></tr></thead>
                <tbody id="custListBody"></tbody>
            </table>
        </div>
    </div>

    <div id="sales-page" class="page">
        <button class="btn-footer" style="background:var(--navy);" onclick="openModule('main-menu')">← BACK TO MENU</button>
        <div class="header"><h3>New Sale</h3></div>
        <div class="input-card">
            <label style="font-size:12px; font-weight:bold;">Select Customer:</label>
            <select id="salesCustSelect"></select>
            <input type="text" id="sItem" placeholder="Item Name (e.g., Gold Ring)">
            <div style="display:flex; gap:5px;">
                <input type="number" id="sWt" placeholder="Weight (g)">
                <input type="number" id="sRate" placeholder="Today's Rate">
            </div>
            <div style="display:flex; gap:5px;">
                <input type="number" id="sLab" placeholder="Labor/Mazzuri">
                <input type="number" id="sStone" placeholder="Stone/Other">
            </div>
            <button class="btn-footer" style="background:var(--credit-green);" onclick="addSale()">GENERATE BILL & SAVE</button>
        </div>
    </div>

    <div id="jobwork-page" class="page">
        <button class="btn-footer" style="background:var(--navy);" onclick="openModule('main-menu')">← MENU</button>
        <div class="header"><h3>Gold Jobwork</h3></div>
        </div>

    <div id="cash-page" class="page">
        <button class="btn-footer" style="background:var(--navy);" onclick="openModule('main-menu')">← MENU</button>
        <div class="header"><h3>Cash Ledger</h3></div>
        </div>
</div>

<script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbx0G79ae_2xJR8kBKE2CxjL_62qOUv0_BqzzmTN5YhopZ61XTg0F499a8QvQ3cTpGjcXw/exec";
    const SHOP_PASS = "1234";
    let masterData = { karigars: {}, customers: {}, sales: [] };

    function checkPass() { if(document.getElementById('passInput').value === SHOP_PASS) { openModule('main-menu'); loadFromServer(); } else alert("Wrong Password!"); }
    function openModule(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    async function loadFromServer() {
        try {
            const r = await fetch(CLOUD_URL); const t = await r.text();
            const cloudData = t.trim() ? JSON.parse(t) : {};
            masterData = { ...masterData, ...cloudData };
            refreshCustUI();
        } catch (e) { console.log("Offline mode"); }
    }

    function saveData() { fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(masterData) }); }

    /* CUSTOMER LOGIC */
    function registerCustomer() {
        const name = document.getElementById('custName').value;
        if(!name) return alert("Enter Name");
        const id = "C_" + Date.now();
        masterData.customers[id] = {
            name,
            phone: document.getElementById('custPhone').value,
            addr: document.getElementById('custAddr').value
        };
        saveData(); refreshCustUI();
        document.getElementById('custName').value = '';
    }

    function refreshCustUI() {
        const body = document.getElementById('custListBody');
        const select = document.getElementById('salesCustSelect');
        body.innerHTML = ''; select.innerHTML = '<option value="">-- Choose Customer --</option>';
        
        Object.keys(masterData.customers).forEach(id => {
            const c = masterData.customers[id];
            body.innerHTML += `<tr><td>${c.name}</td><td>${c.phone}</td><td>${c.addr}</td></tr>`;
            select.innerHTML += `<option value="${id}">${c.name}</option>`;
        });
    }

    /* SALES LOGIC */
    function addSale() {
        const custId = document.getElementById('salesCustSelect').value;
        const item = document.getElementById('sItem').value;
        const wt = parseFloat(document.getElementById('sWt').value) || 0;
        const rate = parseFloat(document.getElementById('sRate').value) || 0;
        const lab = parseFloat(document.getElementById('sLab').value) || 0;
        const stone = parseFloat(document.getElementById('sStone').value) || 0;
        
        if(!custId || !item || wt <= 0) return alert("Enter complete details");
        
        const total = (wt * rate) + lab + stone;
        const sale = {
            date: new Date().toLocaleDateString(),
            customer: masterData.customers[custId].name,
            item, wt, total
        };
        
        masterData.sales.push(sale);
        saveData();
        alert("Sale Recorded! Bill Total: ₹" + total.toLocaleString());
    }
</script>
</body>
</html>
