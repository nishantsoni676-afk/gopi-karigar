<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gopi Jewellers ERP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --debit-red: #e74c3c; --credit-green: #27ae60; --navy: #1e3a8a; }
        html, body { height: 100%; margin: 0; padding: 0; background: #f0f2f5; font-family: -apple-system, sans-serif; }
        .container { background: white; width: 100%; min-height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        .page { display: none; flex-direction: column; padding: 10px; box-sizing: border-box; min-height: 100vh; }
        .page.active { display: flex; }
        .header { text-align: center; border-bottom: 3px solid var(--gold); padding-bottom: 8px; margin-bottom: 12px; }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 25px; flex-grow: 1; align-content: center; }
        .menu-card { background: var(--dark); color: white; padding: 45px 20px; border-radius: 15px; text-align: center; border: 4px solid var(--gold); cursor: pointer; }
        .menu-card h2 { margin: 10px 0 0; font-size: 26px; text-transform: uppercase; font-weight: 900; }
        select, .btn-nav { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: 900; margin-bottom: 8px; font-size: 18px; cursor: pointer; }
        .btn-nav { background: var(--gold); color: var(--dark); text-transform: uppercase; }
        .input-card { padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 2px solid #ddd; }
        .dr-card { border-left: 10px solid var(--debit-red); background: #fffafa; }
        .cr-card { border-left: 10px solid var(--credit-green); background: #fafffa; }
        input { width: 100%; padding: 15px; border: 2px solid #ccc; border-radius: 6px; font-size: 18px; font-weight: bold; box-sizing: border-box; margin-top: 5px; }
        .table-wrap { flex-grow: 1; min-height: 400px; overflow: auto; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; font-size: 16px; font-weight: bold; }
        th { position: sticky; top: 0; background: #eee; z-index: 10; border-bottom: 3px solid #ddd; padding: 12px; font-size: 14px; }
        td { padding: 12px; text-align: center; border: 1px solid #ddd; }
        .btn-del-row { background: #ff4d4d; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 16px; font-weight: bold; }
        .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
        .stat-card { background: var(--dark); color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-card div { font-size: 22px; font-weight: 900; color: var(--gold); }
        .amount-card { background: var(--navy); border: 3px solid var(--gold); grid-column: span 2; }
        .amount-card div { font-size: 36px; }
        .btn-footer { width: 100%; padding: 20px; border: none; border-radius: 10px; font-weight: 900; color: white; margin-top: 10px; font-size: 20px; cursor: pointer; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="page active" style="justify-content:center; align-items:center; text-align:center;">
        <img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:120px; margin-bottom: 20px;">
        <h1>Gopi Jewellers</h1>
        <input type="password" id="passInput" placeholder="Password" style="text-align:center; width: 80%;">
        <button class="btn-footer" style="background:var(--gold); color:var(--dark); width: 80%;" onclick="checkPass()">LOGIN</button>
    </div>

    <div id="main-menu" class="page">
        <div class="header"><h2>Master Dashboard</h2></div>
        <div class="menu-grid">
            <div class="menu-card" onclick="openModule('jobwork-page')">⚖️<h2>Karigar Jobwork</h2></div>
            <div class="menu-card" onclick="openModule('cash-page')">💸<h2>Karigar Cash</h2></div>
        </div>
    </div>

    <div id="jobwork-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding: 10px; font-size:14px;" onclick="openModule('main-menu')">← BACK TO DASHBOARD</button>
        <div class="header"><img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:60px;"><div id="syncStatus" style="font-size:12px; color:#888; font-weight:900;">☁ CONNECTED</div></div>
        <label style="font-weight:900;">Select Karigar:</label>
        <select id="karigarSelectorGold" onchange="syncSelectedId(this.value); renderTable('Gold');"></select>
        <button class="btn-nav" onclick="showModal()">+ REGISTER NEW KARIGAR</button>
        <button class="btn-nav" style="background:#2c3e50; color:white;" onclick="generatePDF('Gold')">📄 DOWNLOAD PDF SLIP</button>
        
        <div class="input-card dr-card">
            <div style="display:flex; gap:5px;"><input type="text" id="drDateGold" placeholder="Date"><input type="text" id="drSamanGold" placeholder="Saman"><input type="number" id="drWtGold" step="0.001" placeholder="Wt"></div>
            <button class="btn-footer" style="background:var(--debit-red);" onclick="addEntry('Gold', 'dr')">ADD ISSUE (DR)</button>
        </div>
        <div class="input-card cr-card">
            <div style="display:flex; gap:5px;"><input type="text" id="crDateGold" placeholder="Date"><input type="text" id="crSamanGold" placeholder="Saman"><input type="number" id="crWtGold" step="0.001" placeholder="Wt"></div>
            <button class="btn-footer" style="background:var(--credit-green);" onclick="addEntry('Gold', 'cr')">ADD JAMA (CR)</button>
        </div>
        
        <div style="padding:15px; background:#eee; border-radius:10px; display:flex; align-items:center; justify-content:space-between; border:1px solid #ccc;">
            <label style="font-size:18px; font-weight:900;">GOLD RATE:</label>
            <input type="number" id="rate" oninput="calculateGold()" placeholder="₹ Rate" style="width: 60%; margin-top:0;">
        </div>

        <div class="table-wrap">
            <table>
                <thead><tr><th colspan="3" style="color:var(--debit-red)">DR - ISSUE</th><th colspan="4" style="color:var(--credit-green)">CR - JAMA</th></tr>
                <tr><th>Date</th><th>Saman</th><th>Wt</th><th>Date</th><th>Saman</th><th>Total Cr</th><th>Net</th></tr></thead>
                <tbody id="ledgerBodyGold"></tbody>
            </table>
        </div>
        <div class="summary">
            <div class="stat-card"><small>TOTAL DR</small><div id="dispDrGold">0.000</div></div>
            <div class="stat-card"><small>TOTAL CR</small><div id="dispCrGold">0.000</div></div>
            <div class="stat-card amount-card"><small>SETTLEMENT (91%)</small><div id="dispRsGold">₹0</div></div>
        </div>
    </div>

    <div id="cash-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding:10px; font-size:14px;" onclick="openModule('main-menu')">← BACK TO DASHBOARD</button>
        <div class="header"><h3>CASH LEDGER</h3></div>
        <label style="font-weight:900;">Karigar:</label>
        <select id="karigarSelectorCash" onchange="syncSelectedId(this.value); renderTable('Cash');"></select>
        <button class="btn-nav" style="background:#2c3e50; color:white;" onclick="generatePDF('Cash')">📄 DOWNLOAD PDF SLIP</button>
        
        <div class="input-card" style="border-left:10px solid var(--navy); background:#f9f9f9;">
            <div style="display:flex; gap:5px;"><input type="text" id="cashDate" placeholder="Date"><input type="text" id="cashPart" placeholder="Cash/GPay"><input type="number" id="cashAmt" placeholder="Amount"></div>
            <button class="btn-footer" style="background:var(--navy);" onclick="addCashEntry()">ADD CASH ENTRY</button>
        </div>
        
        <div class="table-wrap">
            <table>
                <thead><tr><th>Date</th><th>Particulars</th><th>Amount</th><th>Balance</th><th>Action</th></tr></thead>
                <tbody id="ledgerBodyCash"></tbody>
            </table>
        </div>
        <div class="summary"><div class="stat-card amount-card" style="background:var(--dark);"><small>CURRENT BALANCE</small><div id="dispRsCash">₹0</div></div></div>
    </div>
</div>

<div id="modal">
    <div style="background:white; padding:25px; border-radius:12px; width:95%; max-width:400px; text-align:center;">
        <h2>Register Karigar</h2>
        <input type="text" id="newName" placeholder="Karigar Name">
        <button class="btn-footer" style="background:var(--credit-green);" onclick="registerKarigar()">SAVE</button>
        <button class="btn-footer" style="background:#999;" onclick="hideModal()">CANCEL</button>
    </div>
</div>

<script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbx0G79ae_2xJR8kBKE2CxjL_62qOUv0_BqzzmTN5YhopZ61XTg0F499a8QvQ3cTpGjcXw/exec";
    const SHOP_PASS = "1234";
    let masterData = {};
    let activeId = "";

    function checkPass() { if(document.getElementById('passInput').value === SHOP_PASS) { openModule('main-menu'); loadFromServer(); } else alert("Wrong!"); }
    function openModule(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function showModal() { document.getElementById('modal').style.display = 'flex'; }
    function hideModal() { document.getElementById('modal').style.display = 'none'; }

    async function loadFromServer() {
        try {
            const resp = await fetch(CLOUD_URL);
            const text = await resp.text();
            masterData = text.trim() ? JSON.parse(text) : {};
            activeId = localStorage.getItem('gopi_active_id') || Object.keys(masterData)[0] || "";
            refreshUI();
        } catch (e) { masterData = JSON.parse(localStorage.getItem('gopi_master_cloud')) || {}; refreshUI(); }
    }

    function saveData() {
        localStorage.setItem('gopi_master_cloud', JSON.stringify(masterData));
        localStorage.setItem('gopi_active_id', activeId);
        fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(masterData) });
    }

    function refreshUI() {
        const selG = document.getElementById('karigarSelectorGold');
        const selC = document.getElementById('karigarSelectorCash');
        selG.innerHTML = ''; selC.innerHTML = '';
        Object.keys(masterData).forEach(id => {
            const opt = `<option value="${id}" ${id === activeId ? 'selected' : ''}>${masterData[id].name}</option>`;
            selG.innerHTML += opt; selC.innerHTML += opt;
        });
        renderTable('Gold'); renderTable('Cash');
    }

    function syncSelectedId(id) { activeId = id; localStorage.setItem('gopi_active_id', id); refreshUI(); }

    function registerKarigar() {
        const name = document.getElementById('newName').value; if(!name) return;
        activeId = "K_" + Date.now();
        masterData[activeId] = { name, gold: {dr:[], cr:[]}, cash: [] };
        saveData(); hideModal(); refreshUI();
    }

    function addEntry(mod, type) {
        if(!activeId || !masterData[activeId]) return alert("Select Karigar First");
        const val = parseFloat(document.getElementById(type + 'WtGold').value);
        if (isNaN(val)) return alert("Enter weight");
        let entry = { 
            date: document.getElementById(type + 'DateGold').value, 
            saman: document.getElementById(type + 'SamanGold').value, 
            val: val 
        };
        if (type === 'cr') entry.rounded = val < 1 ? 0 : ((val % 1 < 0.35) ? Math.floor(val) : (val % 1 < 0.9 ? Math.floor(val) + 0.5 : Math.floor(val) + 1));
        masterData[activeId].gold[type].push(entry);
        saveData(); renderTable('Gold');
        document.getElementById(type + 'WtGold').value = '';
    }

    function addCashEntry() {
        if(!activeId || !masterData[activeId]) return alert("Select Karigar First");
        const amt = parseFloat(document.getElementById('cashAmt').value);
        if (isNaN(amt)) return alert("Enter amount");
        let k = masterData[activeId];
        let lastBal = k.cash.length > 0 ? k.cash[k.cash.length - 1].bal : 0;
        k.cash.push({ date: document.getElementById('cashDate').value, part: document.getElementById('cashPart').value, amt: amt, bal: lastBal + amt });
        saveData(); renderTable('Cash');
        document.getElementById('cashAmt').value = '';
    }

    function renderTable(mod) {
        if(!activeId || !masterData[activeId]) return;
        const body = document.getElementById('ledgerBody' + mod); body.innerHTML = '';
        let k = masterData[activeId];
        if (mod === 'Gold') {
            const rows = Math.max(k.gold.dr.length, k.gold.cr.length);
            for (let i = 0; i < rows; i++) {
                const dr = k.gold.dr[i], cr = k.gold.cr[i];
                body.innerHTML += `<tr><td>${dr?dr.date:'-'}</td><td>${dr?dr.saman:'-'}</td><td style="background:#fffafa;">${dr?dr.val.toFixed(3):'-'} ${dr ? `<button class="btn-del-row" onclick="deleteRow('dr', ${i})">x</button>` : ''}</td><td>${cr?cr.date:'-'}</td><td>${cr?cr.saman:'-'}</td><td style="background:#fafffa;">${cr?cr.val.toFixed(3):'-'} ${cr ? `<button class="btn-del-row" onclick="deleteRow('cr', ${i})">x</button>` : ''}</td><td>${cr?cr.rounded.toFixed(1):'-'}</td></tr>`;
            }
            calculateGold();
        } else {
            k.cash.forEach((item, i) => { body.innerHTML += `<tr><td>${item.date}</td><td>${item.part}</td><td>₹${item.amt}</td><td>₹${item.bal}</td><td><button class="btn-del-row" onclick="deleteCashRow(${i})">x</button></td></tr>`; });
            document.getElementById('dispRsCash').innerText = "₹" + (k.cash.length > 0 ? k.cash[k.cash.length - 1].bal.toLocaleString() : "0");
        }
    }

    function calculateGold() {
        let k = masterData[activeId]; if(!k) return;
        let rate = parseFloat(document.getElementById('rate').value)||0;
        const tDr = k.gold.dr.reduce((s,i)=>s+i.val,0), tCr = k.gold.cr.reduce((s,i)=>s+i.val,0), tNet = k.gold.cr.reduce((s,i)=>s+(i.rounded||0),0);
        const fine = ((tNet*0.05)-(tDr-tCr))*0.91;
        document.getElementById('dispDrGold').innerText = tDr.toFixed(3);
        document.getElementById('dispCrGold').innerText = tCr.toFixed(3);
        document.getElementById('dispRsGold').innerText = "₹"+Math.abs(Math.round(fine*rate)).toLocaleString('en-IN');
    }

    function deleteCashRow(i) { if(confirm("Delete?")) { masterData[activeId].cash.splice(i, 1); let rb = 0; masterData[activeId].cash.forEach(item => { item.bal = rb + item.amt; rb = item.bal; }); saveData(); renderTable('Cash'); } }
    function deleteRow(type, i) { if(confirm("Delete?")) { masterData[activeId].gold[type].splice(i, 1); saveData(); renderTable('Gold'); } }

    function generatePDF(mod) {
        const k = masterData[activeId];
        let html = `<div style="padding:20px;text-align:center;"><h2>GOPI JEWELLERS</h2><h3>${mod} Statement: ${k.name}</h3>`;
        if(mod==='Gold') {
            html += `<table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr style="background:#eee;"><th>Dr Date</th><th>Dr Wt</th><th>Cr Date</th><th>Cr Wt</th><th>Net</th></tr></thead><tbody>`;
            const rows = Math.max(k.gold.dr.length, k.gold.cr.length);
            for(let i=0; i<rows; i++) html += `<tr><td>${k.gold.dr[i]?.date||'-'}</td><td>${k.gold.dr[i]?.val.toFixed(3)||'-'}</td><td>${k.gold.cr[i]?.date||'-'}</td><td>${k.gold.cr[i]?.val.toFixed(3)||'-'}</td><td>${k.gold.cr[i]?.rounded.toFixed(1)||'-'}</td></tr>`;
            html += `</tbody></table><h3>Total Settlement: ${document.getElementById('dispRsGold').innerText}</h3>`;
        } else {
            html += `<table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr style="background:#eee;"><th>Date</th><th>Particulars</th><th>Amount</th><th>Balance</th></tr></thead><tbody>`;
            k.cash.forEach(item => html += `<tr><td>${item.date}</td><td>${item.part}</td><td>₹${item.amt}</td><td>₹${item.bal}</td></tr>`);
            html += `</tbody></table><h3>Final Balance: ${document.getElementById('dispRsCash').innerText}</h3>`;
        }
        html += `</div>`;
        html2pdf().from(html).save(`${k.name}_${mod}.pdf`);
    }
</script>
</body>
</html>
