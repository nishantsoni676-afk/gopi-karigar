<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gopi Jewellers ERP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --debit-red: #e74c3c; --credit-green: #27ae60; --navy: #1e3a8a; }
        html, body { height: 100%; margin: 0; padding: 0; background: #f0f2f5; font-family: -apple-system, sans-serif; }
        .container { background: white; width: 100%; min-height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        .page { display: none; flex-direction: column; padding: 10px; box-sizing: border-box; min-height: 100vh; }
        .page.active { display: flex; }
        
        /* Menu Styling */
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 25px; flex-grow: 1; align-content: center; }
        .menu-card { background: var(--dark); color: white; padding: 40px 20px; border-radius: 15px; text-align: center; border: 4px solid var(--gold); cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .menu-card h2 { margin: 10px 0 0; font-size: 24px; text-transform: uppercase; font-weight: 900; }

        /* Shared UI Elements */
        .header { text-align: center; border-bottom: 3px solid var(--gold); padding-bottom: 8px; margin-bottom: 12px; }
        input, select, .btn-nav { width: 100%; padding: 15px; border-radius: 8px; border: 2px solid #ccc; font-weight: bold; margin-bottom: 8px; font-size: 16px; box-sizing: border-box; }
        .btn-nav { background: var(--gold); color: var(--dark); text-transform: uppercase; border: none; cursor: pointer; }
        .btn-footer { width: 100%; padding: 20px; border: none; border-radius: 10px; font-weight: 900; color: white; margin-top: 10px; font-size: 20px; cursor: pointer; }
        
        .input-card { padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 2px solid #ddd; background: #f9f9f9; }
        .table-wrap { flex-grow: 1; min-height: 350px; overflow: auto; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; background: white; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; font-size: 14px; font-weight: bold; }
        th { position: sticky; top: 0; background: #eee; z-index: 10; border-bottom: 2px solid #ddd; padding: 10px; }
        td { padding: 10px; text-align: center; border: 1px solid #ddd; }
        
        .logo-container { cursor: pointer; position: relative; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="page active" style="justify-content: center; align-items: center; text-align: center;">
        <div class="logo-container" onclick="document.getElementById('logoInput').click()">
            <img id="shopLogo" src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:120px; height:120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); margin-bottom: 20px;">
        </div>
        <input type="file" id="logoInput" accept="image/*" style="display:none" onchange="uploadLogo(this)">
        <h1>Gopi Jewellers</h1>
        <input type="password" id="passInput" placeholder="Password" style="text-align:center; width: 80%;">
        <button class="btn-footer" style="background:var(--gold); color:var(--dark); width: 80%;" onclick="checkPass()">LOGIN</button>
    </div>

    <div id="main-menu" class="page">
        <div class="header"><h2>Control Panel</h2></div>
        <div class="menu-grid">
            <div class="menu-card" onclick="openModule('jobwork-page')">⚖️<h2>Karigar Jobwork</h2></div>
            <div class="menu-card" onclick="openModule('cash-page')">💸<h2>Karigar Cash</h2></div>
            <div class="menu-card" onclick="openModule('cust-page')" style="background:var(--navy);">👤<h2>Add Customer</h2></div>
        </div>
    </div>

    <div id="cust-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding: 10px; font-size: 14px;" onclick="openModule('main-menu')">← BACK TO MENU</button>
        <div class="header"><h3>Customer Management</h3></div>
        <div class="input-card">
            <input type="text" id="custName" placeholder="Full Name">
            <input type="text" id="custPhone" placeholder="Phone Number">
            <input type="text" id="custAddr" placeholder="City/Address">
            <button class="btn-footer" style="background:var(--credit-green);" onclick="addCustomer()">SAVE CUSTOMER</button>
        </div>
        <div class="table-wrap">
            <table style="min-width: 100%;">
                <thead><tr><th>Name</th><th>Phone</th><th>Address</th><th>Action</th></tr></thead>
                <tbody id="custListBody"></tbody>
            </table>
        </div>
    </div>

    <div id="jobwork-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding: 10px; font-size: 14px;" onclick="openModule('main-menu')">← BACK TO MENU</button>
        </div>

    <div id="cash-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding: 10px; font-size: 14px;" onclick="openModule('main-menu')">← BACK TO MENU</button>
        </div>
</div>

<script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbx0G79ae_2xJR8kBKE2CxjL_62qOUv0_BqzzmTN5YhopZ61XTg0F499a8QvQ3cTpGjcXw/exec";
    const SHOP_PASS = "1234";
    let masterData = { customers: {} };

    // Function to handle login
    function checkPass() {
        if(document.getElementById('passInput').value === SHOP_PASS) {
            openModule('main-menu');
            loadFromServer();
        } else { alert("Wrong Password!"); }
    }

    // Function to switch between pages
    function openModule(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'cust-page') refreshCustUI();
    }

    // Cloud Data Management
    async function loadFromServer() {
        try {
            const r = await fetch(CLOUD_URL);
            const t = await r.text();
            const cloudData = t.trim() ? JSON.parse(t) : {};
            masterData = { ...masterData, ...cloudData };
            if(!masterData.customers) masterData.customers = {};
            refreshCustUI();
        } catch (e) { console.log("Cloud Error"); }
    }

    function saveData() {
        fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(masterData) });
    }

    // Customer Logic
    function addCustomer() {
        const name = document.getElementById('custName').value;
        if(!name) return alert("Please enter a name");
        const id = "C_" + Date.now();
        masterData.customers[id] = {
            name: name,
            phone: document.getElementById('custPhone').value,
            addr: document.getElementById('custAddr').value
        };
        saveData();
        refreshCustUI();
        document.getElementById('custName').value = '';
        document.getElementById('custPhone').value = '';
        document.getElementById('custAddr').value = '';
    }

    function refreshCustUI() {
        const body = document.getElementById('custListBody');
        body.innerHTML = '';
        Object.keys(masterData.customers).forEach(id => {
            const c = masterData.customers[id];
            body.innerHTML += `<tr><td>${c.name}</td><td>${c.phone}</td><td>${c.addr}</td><td><button onclick="deleteCust('${id}')" style="background:red; color:white; border:none; padding:5px; border-radius:5px;">x</button></td></tr>`;
        });
    }

    function deleteCust(id) {
        if(confirm("Delete customer?")) {
            delete masterData.customers[id];
            saveData();
            refreshCustUI();
        }
    }

    // Logo Logic
    function uploadLogo(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('shopLogo').src = e.target.result;
                localStorage.setItem('shopLogo', e.target.result);
            };
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
