<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gopi Jewellers Cloud</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --debit-red: #e74c3c; --credit-green: #27ae60; --navy: #1e3a8a; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .container { background: white; max-width: 600px; margin: auto; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        .header { text-align: center; border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 15px; }
        .manager-bar { background: var(--dark); color: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        select, .btn-nav { width: 100%; padding: 12px; border-radius: 6px; border: none; font-weight: bold; margin-bottom: 8px; font-size: 14px; cursor: pointer; }
        .btn-nav { background: var(--gold); color: var(--dark); }
        .input-card { padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #ddd; }
        .dr-card { border-left: 8px solid var(--debit-red); background: #fff5f5; }
        .cr-card { border-left: 8px solid var(--credit-green); background: #f5fff5; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; margin-top: 5px; }
        .table-wrap { overflow-x: auto; margin: 15px 0; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; font-size: 12px; }
        th { background: #f8f9fa; padding: 10px; border: 1px solid #ddd; font-size: 11px; }
        td { padding: 8px; text-align: center; border: 1px solid #f0f0f0; }
        .editable:hover { background: #e8f0fe; cursor: pointer; }
        .btn-del-row { background: #ff4d4d; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; }
        .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .stat-card { background: var(--dark); color: white; padding: 12px; border-radius: 8px; text-align: center; }
        .stat-card div { font-size: 16px; font-weight: bold; color: var(--gold); margin-top: 5px; }
        .highlight-net { background: #2c3e50; border: 1px solid var(--gold); }
        .amount-card { grid-column: span 2; background: var(--navy); padding: 20px; border: 2px solid var(--gold); }
        .amount-card div { color: var(--gold) !important; font-size: 28px; font-weight: bold; }
        .btn-footer { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; margin-top: 10px; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        #login-screen { text-align: center; padding: 50px 20px; }
    </style>
</head>
<body>

<div id="login-screen" class="container">
    <img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:100px; margin-bottom: 20px;">
    <h2>Gopi Jewellers</h2>
    <input type="password" id="passInput" placeholder="Enter Password" autofocus>
    <button class="btn-footer" style="background:var(--gold); color:var(--dark);" onclick="checkPass()">LOGIN</button>
</div>

<div id="app-content" class="container" style="display:none;">
    <div class="header">
        <img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:60px;">
        <div id="syncStatus" style="font-size:10px; color:#888;">☁ Initializing...</div>
    </div>

    <div class="manager-bar">
        <select id="karigarSelector" onchange="switchKarigar()"></select>
        <button class="btn-nav" onclick="showModal()">+ New Karigar Registration</button>
        <button class="btn-nav" style="background:#2c3e50; color:white;" onclick="generatePDF()">📄 Download PDF Slip</button>
    </div>

    <div class="input-card dr-card">
        <div style="display:flex; gap:5px;">
            <input type="text" id="drDate" placeholder="Date">
            <input type="text" id="drSaman" placeholder="Saman">
            <input type="number" id="drWt" step="0.001" placeholder="Wt">
        </div>
        <button class="btn-footer" style="background:var(--debit-red);" onclick="addEntry('Dr')">ADD ISSUE (DR)</button>
    </div>

    <div class="input-card cr-card">
        <div style="display:flex; gap:5px;">
            <input type="text" id="crDate" placeholder="Date">
            <input type="text" id="crSaman" placeholder="Saman">
            <input type="number" id="crWt" step="0.001" placeholder="Wt">
        </div>
        <button class="btn-footer" style="background:var(--credit-green);" onclick="addEntry('Cr')">ADD JAMA (CR)</button>
    </div>

    <div style="padding:10px; background:#eee; border-radius:8px;">
        <label style="font-size:12px; font-weight:bold;">Gold Rate (₹)</label>
        <input type="number" id="rate" oninput="calculate()" placeholder="Enter Rate">
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr><th colspan="3" style="color:var(--debit-red)">DR - ISSUE</th><th colspan="4" style="color:var(--credit-green)">CR - JAMA</th></tr>
                <tr><th>Date</th><th>Saman</th><th>Wt</th><th>Date</th><th>Saman</th><th>Total Cr</th><th>Net</th></tr>
            </thead>
            <tbody id="ledgerBody"></tbody>
        </table>
    </div>

    <div class="summary">
        <div class="stat-card">Total Dr<div id="dispDr">0.000</div></div>
        <div class="stat-card">Total Cr<div id="dispCr">0.000</div></div>
        <div class="stat-card highlight-net">Total Net<div id="dispTotalNet">0.0</div></div>
        <div class="stat-card">Balance<div id="dispBal">0.000</div></div>
        <div class="stat-card">Kam Fine<div id="dispNet">0.000</div></div>
        <div class="stat-card amount-card">
            <small>Settlement Amount</small>
            <div id="dispRs">₹0</div>
        </div>
    </div>
    <button class="btn-footer" style="background:#e74c3c" onclick="deleteKarigar()">Delete This Profile Permanently</button>
</div>

<div id="modal">
    <div style="background:white; padding:20px; border-radius:12px; width:90%; max-width:400px;">
        <h3>Register Karigar</h3>
        <label>Name</label><input type="text" id="newName">
        <label>Phone</label><input type="text" id="newPhone">
        <button class="btn-footer" style="background:var(--credit-green);" onclick="registerKarigar()">Save</button>
        <button class="btn-footer" style="background:#999;" onclick="hideModal()">Cancel</button>
    </div>
</div>

<script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbx0G79ae_2xJR8kBKE2CxjL_62qOUv0_BqzzmTN5YhopZ61XTg0F499a8QvQ3cTpGjcXw/exec";
    const SHOP_PASS = "1234";
    let masterData = {};
    let currentId = "";

    function checkPass() {
        if(document.getElementById('passInput').value === SHOP_PASS) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            loadFromServer();
        } else { alert("Wrong Password!"); }
    }

    async function loadFromServer() {
        try {
            const response = await fetch(CLOUD_URL);
            const text = await response.text();
            masterData = text.trim() ? JSON.parse(text) : {};
            currentId = localStorage.getItem('gopi_active_id') || Object.keys(masterData)[0] || "";
            refreshUI();
            document.getElementById('syncStatus').innerText = "✅ Cloud Connected";
        } catch (err) {
            document.getElementById('syncStatus').innerText = "📶 Offline Mode";
            masterData = JSON.parse(localStorage.getItem('gopi_master_cloud')) || {};
            refreshUI();
        }
    }

    async function syncToServer() {
        document.getElementById('syncStatus').innerText = "⏳ Saving...";
        try {
            await fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(masterData) });
            document.getElementById('syncStatus').innerText = "✅ Saved to Cloud";
        } catch (err) { document.getElementById('syncStatus').innerText = "❌ Sync Error"; }
    }

    function saveData() {
        localStorage.setItem('gopi_master_cloud', JSON.stringify(masterData));
        localStorage.setItem('gopi_active_id', currentId);
        syncToServer();
    }

    function showModal() { document.getElementById('modal').style.display = 'flex'; }
    function hideModal() { document.getElementById('modal').style.display = 'none'; }

    function registerKarigar() {
        const name = document.getElementById('newName').value;
        if (!name) return alert("Enter Name");
        const id = "K_" + Date.now();
        masterData[id] = { name, phone: document.getElementById('newPhone').value, dr: [], cr: [], rate: 0 };
        currentId = id; saveData(); hideModal(); refreshUI();
    }

    function addEntry(type) {
        if(!currentId) return alert("Select Karigar First");
        const wt = parseFloat(document.getElementById(type.toLowerCase() + 'Wt').value);
        if (isNaN(wt)) return alert("Enter Weight");
        let entry = { 
            date: document.getElementById(type.toLowerCase() + 'Date').value, 
            saman: document.getElementById(type.toLowerCase() + 'Saman').value, 
            wt: wt 
        };
        if (type === 'Cr') {
            if (wt < 1) { entry.rounded = 0; }
            else {
                let d = parseFloat((wt - Math.floor(wt)).toFixed(2));
                entry.rounded = (d < 0.35) ? Math.floor(wt) : (d < 0.9 ? Math.floor(wt) + 0.5 : Math.floor(wt) + 1);
            }
        }
        masterData[currentId][type.toLowerCase()].push(entry);
        saveData(); renderTable();
    }

    function editCell(type, index, field) {
        let k = masterData[currentId];
        let arr = (type === 'Dr') ? k.dr : k.cr;
        let newVal = prompt(`Edit ${field}:`, arr[index][field]);
        if (newVal !== null) {
            arr[index][field] = (field === 'wt' || field === 'rounded') ? parseFloat(newVal) : newVal;
            saveData(); renderTable();
        }
    }

    function deleteRow(type, index) {
        if(confirm("Delete this entry?")) {
            (type === 'Dr' ? masterData[currentId].dr : masterData[currentId].cr).splice(index, 1);
            saveData(); renderTable();
        }
    }

    function calculate() {
        let k = masterData[currentId];
        if(!k) return;
        let rate = parseFloat(document.getElementById('rate').value) || 0;
        k.rate = rate;
        const totalDr = k.dr.reduce((s, i) => s + i.wt, 0);
        const totalCr = k.cr.reduce((s, i) => s + i.wt, 0);
        const totalNet = k.cr.reduce((s, i) => s + (i.rounded || 0), 0);
        const netBal = totalDr - totalCr;
        const fine = ((totalNet * 0.05) - netBal) * 0.91;
        
        document.getElementById('dispDr').innerText = totalDr.toFixed(3);
        document.getElementById('dispCr').innerText = totalCr.toFixed(3);
        document.getElementById('dispTotalNet').innerText = totalNet.toFixed(1);
        document.getElementById('dispBal').innerText = netBal.toFixed(3);
        document.getElementById('dispNet').innerText = fine.toFixed(5);
        document.getElementById('dispRs').innerText = "₹" + Math.abs(Math.round(fine * rate)).toLocaleString('en-IN');
    }

    function renderTable() {
        const body = document.getElementById('ledgerBody');
        body.innerHTML = '';
        let k = masterData[currentId];
        if(!k) return;
        const rows = Math.max(k.dr.length, k.cr.length);
        for (let i = 0; i < rows; i++) {
            const dr = k.dr[i]; const cr = k.cr[i];
            body.innerHTML += `<tr>
                <td class="editable" onclick="editCell('Dr', ${i}, 'date')">${dr ? dr.date : '-'}</td>
                <td class="editable" onclick="editCell('Dr', ${i}, 'saman')">${dr ? dr.saman : '-'}</td>
                <td style="background:#fffafa;">${dr ? dr.wt.toFixed(3) : '-'} ${dr ? `<button class="btn-del-row" onclick="deleteRow('Dr', ${i})">x</button>` : ''}</td>
                <td class="editable" onclick="editCell('Cr', ${i}, 'date')">${cr ? cr.date : '-'}</td>
                <td class="editable" onclick="editCell('Cr', ${i}, 'saman')">${cr ? cr.saman : '-'}</td>
                <td class="editable" onclick="editCell('Cr', ${i}, 'wt')" style="background:#fafffa;">${cr ? cr.wt.toFixed(3) : '-'} ${cr ? `<button class="btn-del-row" onclick="deleteRow('Cr', ${i})">x</button>` : ''}</td>
                <td class="editable" onclick="editCell('Cr', ${i}, 'rounded')" style="font-weight:bold">${cr ? cr.rounded.toFixed(1) : '-'}</td>
            </tr>`;
        }
        calculate();
    }

    function refreshUI() {
        const selector = document.getElementById('karigarSelector');
        selector.innerHTML = '';
        Object.keys(masterData).forEach(id => {
            let opt = document.createElement('option');
            opt.value = id; opt.innerHTML = masterData[id].name;
            if(id === currentId) opt.selected = true;
            selector.appendChild(opt);
        });
        renderTable();
    }

    function switchKarigar() { currentId = document.getElementById('karigarSelector').value; localStorage.setItem('gopi_active_id', currentId); refreshUI(); }
    function deleteKarigar() { if(confirm("Permanently delete this Karigar?")) { delete masterData[currentId]; currentId = Object.keys(masterData)[0] || ""; saveData(); refreshUI(); } }

    function generatePDF() {
        const k = masterData[currentId];
        let pdfHTML = `<div style="padding:20px; font-family:sans-serif; text-align:center;">
            <img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:60px;">
            <h2 style="margin:5px 0;">GOPI JEWELLERS</h2>
            <p style="margin:5px 0;"><b>Karigar:</b> ${k.name} | <b>Rate:</b> ₹${k.rate}</p>
            <table style="width:100%; border-collapse:collapse; font-size:10px; margin-top:10px;">
                <thead>
                    <tr style="background:#eee;">
                        <th style="border:1px solid #ddd; padding:5px;">Dr Date</th>
                        <th style="border:1px solid #ddd; padding:5px;">Dr Saman</th>
                        <th style="border:1px solid #ddd; padding:5px;">Dr Wt</th>
                        <th style="border:1px solid #ddd; padding:5px;">Cr Date</th>
                        <th style="border:1px solid #ddd; padding:5px;">Cr Saman</th>
                        <th style="border:1px solid #ddd; padding:5px;">Total Cr</th>
                        <th style="border:1px solid #ddd; padding:5px;">Net</th>
                    </tr>
                </thead>
                <tbody>`;
        const rows = Math.max(k.dr.length, k.cr.length);
        for (let i = 0; i < rows; i++) {
            pdfHTML += `<tr>
                <td style="border:1px solid #ddd; padding:5px;">${k.dr[i]?.date || '-'}</td>
                <td style="border:1px solid #ddd; padding:5px;">${k.dr[i]?.saman || '-'}</td>
                <td style="border:1px solid #ddd; padding:5px;">${k.dr[i]?.wt.toFixed(3) || '-'}</td>
                <td style="border:1px solid #ddd; padding:5px;">${k.cr[i]?.date || '-'}</td>
                <td style="border:1px solid #ddd; padding:5px;">${k.cr[i]?.saman || '-'}</td>
                <td style="border:1px solid #ddd; padding:5px;">${k.cr[i]?.wt.toFixed(3) || '-'}</td>
                <td style="border:1px solid #ddd; padding:5px; font-weight:bold;">${k.cr[i]?.rounded.toFixed(1) || '-'}</td>
            </tr>`;
        }
        pdfHTML += `</tbody></table>
            <div style="background:#1e3a8a; color:#d4af37; padding:15px; margin-top:20px; border-radius:10px; text-align:center;">
                <p style="margin:0; color:white; font-size:12px;">Total Net: ${document.getElementById('dispTotalNet').innerText} | Fine: ${document.getElementById('dispNet').innerText}</p>
                <h2 style="margin:10px 0;">Total Settlement: ${document.getElementById('dispRs').innerText}</h2>
            </div>
        </div>`;
        html2pdf().from(pdfHTML).set({ margin: 5, filename: `${k.name}_Slip.pdf`, html2canvas: { scale: 2 } }).save();
    }
</script>
</body>
</html>
