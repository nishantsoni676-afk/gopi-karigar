<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gopi Jewellers ERP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --debit-red: #e74c3c; --credit-green: #27ae60; --navy: #1e3a8a; }
        html, body { height: 100%; margin: 0; padding: 0; background: #f0f2f5; font-family: -apple-system, sans-serif; }
        .container { background: white; width: 100%; min-height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        .page { display: none; flex-direction: column; padding: 10px; box-sizing: border-box; min-height: 100vh; }
        .page.active { display: flex; }
        .header { text-align: center; border-bottom: 3px solid var(--gold); padding-bottom: 8px; margin-bottom: 12px; }
        
        /* Menu Grid Update */
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; padding: 20px; flex-grow: 1; align-content: center; }
        .menu-card { background: var(--dark); color: white; padding: 30px 15px; border-radius: 12px; text-align: center; border: 3px solid var(--gold); cursor: pointer; }
        .menu-card h2 { margin: 10px 0 0; font-size: 20px; text-transform: uppercase; font-weight: 900; }

        input, select, .btn-nav { width: 100%; padding: 15px; border-radius: 8px; border: 2px solid #ccc; font-weight: bold; margin-bottom: 8px; font-size: 16px; box-sizing: border-box; }
        .btn-nav { background: var(--gold); color: var(--dark); text-transform: uppercase; border: none; cursor: pointer; }
        .btn-footer { width: 100%; padding: 20px; border: none; border-radius: 10px; font-weight: 900; color: white; margin-top: 10px; font-size: 20px; cursor: pointer; }
        
        .input-card { padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 2px solid #ddd; }
        .dr-card { border-left: 10px solid var(--debit-red); background: #fffafa; }
        .cr-card { border-left: 10px solid var(--credit-green); background: #fafffa; }
        
        .table-wrap { flex-grow: 1; min-height: 300px; overflow: auto; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; background: white; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; font-size: 14px; font-weight: bold; }
        th { position: sticky; top: 0; background: #eee; z-index: 10; border-bottom: 2px solid #ddd; padding: 10px; }
        td { padding: 10px; text-align: center; border: 1px solid #ddd; }
        
        .btn-del-row { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; }
        .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
        .stat-card { background: var(--dark); color: white; padding: 12px; border-radius: 8px; text-align: center; }
        .stat-card div { font-size: 20px; font-weight: 900; color: var(--gold); }
        .full-width-card { grid-column: span 2; padding: 15px; border: 2px solid var(--gold); }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="page active" style="justify-content: center; align-items: center; text-align: center;">
        <div class="logo-container" onclick="document.getElementById('logoInput').click()">
            <img id="shopLogo" src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:120px; height:120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); margin-bottom: 20px;">
        </div>
        <input type="file" id="logoInput" accept="image/*" style="display:none" onchange="uploadLogo(this)">
        <h1>Gopi Jewellers</h1>
        <input type="password" id="passInput" placeholder="Password" style="text-align:center; width: 80%;">
        <button class="btn-footer" style="background:var(--gold); color:var(--dark); width: 80%;" onclick="checkPass()">LOGIN</button>
    </div>

    <div id="main-menu" class="page">
        <div class="header"><h2>Control Panel</h2></div>
        <div class="menu-grid">
            <div class="menu-card" onclick="openModule('jobwork-page')">⚖️<h2>Karigar Jobwork</h2></div>
            <div class="menu-card" onclick="openModule('cash-page')">💸<h2>Karigar Cash</h2></div>
            <div class="menu-card" onclick="openModule('daily-cash-page')" style="background:var(--navy);">🗓️<h2>Daily Cash Book</h2></div>
        </div>
    </div>

    <div id="daily-cash-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding: 10px; font-size: 14px;" onclick="openModule('main-menu')">← BACK TO MENU</button>
        <div class="header"><h2>Daily Shop Cash Book</h2></div>
        
        <div class="input-card" style="border-top: 5px solid var(--gold);">
            <div style="display:flex; gap:5px;"><input type="text" id="dailyDate" placeholder="Date" style="width:35%;"><input type="text" id="dailyPart" placeholder="Details (Sales/Expense)"></div>
            <div style="display:flex; gap:5px; margin-top:5px;">
                <input type="number" id="dailyAmt" placeholder="Amount ₹">
                <select id="dailyType" style="width:40%;">
                    <option value="In">CASH IN (+)</option>
                    <option value="Out">CASH OUT (-)</option>
                </select>
            </div>
            <button class="btn-footer" style="background:var(--credit-green);" onclick="addDailyEntry()">SAVE ENTRY</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Date</th><th>Description</th><th>Cash In</th><th>Cash Out</th><th>Balance</th><th>X</th></tr>
                </thead>
                <tbody id="dailyTableBody"></tbody>
            </table>
        </div>
        <div class="summary">
            <div class="stat-card full-width-card" style="background:var(--dark); border:2px solid var(--gold);">
                <small>CLOSING CASH BALANCE</small>
                <div id="dispDailyBal">₹0</div>
            </div>
        </div>
    </div>

    <div id="jobwork-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding: 10px; font-size: 14px;" onclick="openModule('main-menu')">← BACK TO MENU</button>
        </div>
    <div id="cash-page" class="page">
        <button class="btn-footer" style="background:var(--navy); padding: 10px; font-size: 14px;" onclick="openModule('main-menu')">← BACK TO MENU</button>
        </div>
</div>

<script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbx0G79ae_2xJR8kBKE2CxjL_62qOUv0_BqzzmTN5YhopZ61XTg0F499a8QvQ3cTpGjcXw/exec";
    const SHOP_PASS = "1234";
    let masterData = { dailyEntries: [] }; 

    function getToday() { return new Date().toLocaleDateString('en-GB'); }
    function setDates() { document.getElementById('dailyDate').value = getToday(); }

    async function loadFromServer() {
        try {
            const r = await fetch(CLOUD_URL);
            const t = await r.text();
            const cloudData = t.trim() ? JSON.parse(t) : {};
            masterData = { ...masterData, ...cloudData };
            if(!masterData.dailyEntries) masterData.dailyEntries = [];
            refreshUI();
        } catch (e) { console.log("Cloud Error"); }
    }

    function saveData() {
        fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(masterData) });
    }

    // DAILY CASH BOOK LOGIC
    function addDailyEntry() {
        const amt = parseFloat(document.getElementById('dailyAmt').value);
        if(isNaN(amt)) return;
        masterData.dailyEntries.push({
            date: document.getElementById('dailyDate').value || getToday(),
            part: document.getElementById('dailyPart').value || "General",
            type: document.getElementById('dailyType').value,
            amt: amt
        });
        saveData();
        renderDailyTable();
        document.getElementById('dailyAmt').value = '';
        document.getElementById('dailyPart').value = '';
    }

    function renderDailyTable() {
        const body = document.getElementById('dailyTableBody'); body.innerHTML = '';
        let bal = 0;
        masterData.dailyEntries.forEach((e, idx) => {
            let inAmt = e.type === 'In' ? e.amt : 0;
            let outAmt = e.type === 'Out' ? e.amt : 0;
            bal += (inAmt - outAmt);
            body.innerHTML += `<tr><td>${e.date}</td><td>${e.part}</td><td style="color:green;">${inAmt||'-'}</td><td style="color:red;">${outAmt||'-'}</td><td>₹${bal}</td><td><button class="btn-del-row" onclick="deleteDaily(${idx})">x</button></td></tr>`;
        });
        document.getElementById('dispDailyBal').innerText = "₹" + bal;
    }

    function deleteDaily(idx) {
        if(confirm("Delete entry?")) { masterData.dailyEntries.splice(idx, 1); saveData(); renderDailyTable(); }
    }

    function checkPass() { if(document.getElementById('passInput').value === SHOP_PASS) { openModule('main-menu'); loadFromServer(); } else alert("Wrong!"); }
    function openModule(id) { 
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); 
        document.getElementById(id).classList.add('active'); 
        if(id === 'daily-cash-page') { setDates(); renderDailyTable(); }
    }
</script>
</body>
</html>
