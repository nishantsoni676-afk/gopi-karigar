<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gopi Jewellers Cloud</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --debit-red: #e74c3c; --credit-green: #27ae60; --navy: #1e3a8a; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 5px; }
        .container { background: white; width: 100%; max-width: 500px; margin: auto; border-radius: 8px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); box-sizing: border-box; }
        .header { text-align: center; border-bottom: 2px solid var(--gold); padding-bottom: 5px; margin-bottom: 10px; }
        .manager-bar { background: var(--dark); color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        select, .btn-nav { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: bold; margin-bottom: 5px; font-size: 13px; cursor: pointer; }
        .btn-nav { background: var(--gold); color: var(--dark); }
        .input-card { padding: 8px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #ddd; }
        .dr-card { border-left: 5px solid var(--debit-red); background: #fff5f5; }
        .cr-card { border-left: 5px solid var(--credit-green); background: #f5fff5; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; margin-top: 4px; }
        
        /* SCROLLABLE TABLE */
        .table-wrap { max-height: 280px; overflow-y: auto; overflow-x: auto; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; min-width: 550px; font-size: 11px; }
        thead th { position: sticky; top: 0; background: #f8f9fa; z-index: 10; border-bottom: 1px solid #ddd; padding: 8px; }
        td { padding: 6px; text-align: center; border: 1px solid #f0f0f0; }
        
        .btn-del-row { background: #ff4d4d; color: white; border: none; padding: 3px 6px; border-radius: 3px; font-size: 9px; cursor: pointer; }

        /* SUMMARY GRID - COMPACT FOR MOBILE */
        .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
        .stat-card { background: var(--dark); color: white; padding: 8px; border-radius: 6px; text-align: center; }
        .stat-card small { font-size: 9px; color: #aaa; text-transform: uppercase; }
        .stat-card div { font-size: 14px; font-weight: bold; color: var(--gold); margin-top: 2px; }
        
        .full-width-card { grid-column: span 2; padding: 12px; border: 1px solid var(--gold); }
        .fine-card { background: #2c3e50; }
        .fine-card div { color: white !important; font-size: 18px; }
        .amount-card { background: var(--navy); border: 2px solid var(--gold); }
        .amount-card div { color: var(--gold) !important; font-size: 24px; font-weight: bold; }
        
        .btn-footer { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; margin-top: 8px; font-size: 13px; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 10px; box-sizing: border-box; }
        #login-screen { text-align: center; padding: 40px 10px; }
    </style>
</head>
<body>

<div id="login-screen" class="container">
    <img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:80px; margin-bottom: 15px;">
    <h2>Gopi Jewellers</h2>
    <input type="password" id="passInput" placeholder="Password" autofocus>
    <button class="btn-footer" style="background:var(--gold); color:var(--dark);" onclick="checkPass()">LOGIN</button>
</div>

<div id="app-content" class="container" style="display:none;">
    <div class="header">
        <img src="https://i.postimg.cc/85zKzX68/1000207262.png" style="width:50px;">
        <div id="syncStatus" style="font-size:9px; color:#888;">☁ Syncing...</div>
    </div>

    <div class="manager-bar">
        <select id="karigarSelector" onchange="switchKarigar()"></select>
        <button class="btn-nav" onclick="showModal()">+ New Registration</button>
        <button class="btn-nav" style="background:#2c3e50; color:white;" onclick="generatePDF()">📄 Download PDF</button>
    </div>

    <div class="input-card dr-card">
        <div style="display:flex; gap:3px;">
            <input type="text" id="drDate" placeholder="Date">
            <input type="text" id="drSaman" placeholder="Saman">
            <input type="number" id="drWt" step="0.001" placeholder="Wt">
        </div>
        <button class="btn-footer" style="background:var(--debit-red);" onclick="addEntry('Dr')">ADD ISSUE (DR)</button>
    </div>

    <div class="input-card cr-card">
        <div style="display:flex; gap:3px;">
            <input type="text" id="crDate" placeholder="Date">
            <input type="text" id="crSaman" placeholder="Saman">
            <input type="number" id="crWt" step="0.001" placeholder="Wt">
        </div>
        <button class="btn-footer" style="background:var(--credit-green);" onclick="addEntry('Cr')">ADD JAMA (CR)</button>
    </div>

    <div style="padding:8px; background:#eee; border-radius:6px; display: flex; align-items: center; justify-content: space-between;">
        <label style="font-size:11px; font-weight:bold;">Rate:</label>
        <input type="number" id="rate" oninput="calculate()" placeholder="₹ Rate" style="width: 70%; margin-top: 0;">
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr><th colspan="3" style="color:var(--debit-red)">DR - ISSUE</th><th colspan="4" style="color:var(--credit-green)">CR - JAMA</th></tr>
                <tr><th>Date</th><th>Saman</th><th>Wt</th><th>Date</th><th>Saman</th><th>Total Cr</th><th>Net</th></tr>
            </thead>
            <tbody id="ledgerBody"></tbody>
        </table>
    </div>

    <div class="summary">
        <div class="stat-card"><small>Total Dr</small><div id="dispDr">0.000</div></div>
        <div class="stat-card"><small>Total Cr</small><div id="dispCr">0.000</div></div>
        <div class="stat-card"><small>Total Net</small><div id="dispTotalNet">0.0</div></div>
        <div class="stat-card"><small>Balance</small><div id="dispBal">0.000</div></div>
        
        <div class="stat-card full-width-card fine-card">
            <small>Kam Fine (91.60)</small>
            <div id="dispNet">0.00000</div>
        </div>
        
        <div class="stat-card full-width-card amount-card">
            <small>Settlement Amount</small>
            <div id="dispRs">₹0</div>
        </div>
    </div>
    
    <button class="btn-footer" style="background:#e74c3c" onclick="deleteKarigar()">Delete Profile</button>
</div>

<div id="modal">
    <div style="background:white; padding:15px; border-radius:8px; width:95%; max-width:350px;">
        <h3>Register Karigar</h3>
        <input type="text" id="newName" placeholder="Karigar Name">
        <input type="text" id="newPhone" placeholder="Phone">
        <button class="btn-footer" style="background:var(--credit-green);" onclick="registerKarigar()">Save</button>
        <button class="btn-footer" style="background:#999;" onclick="hideModal()">Cancel</button>
    </div>
</div>

<script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbx0G79ae_2xJR8kBKE2CxjL_62qOUv0_BqzzmTN5YhopZ61XTg0F499a8QvQ3cTpGjcXw/exec";
    const SHOP_PASS = "1234";
    let masterData = {};
    let currentId = "";

    function checkPass() {
        if(document.getElementById('passInput').value === SHOP_PASS) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            loadFromServer();
        } else { alert("Wrong Password!"); }
    }

    async function loadFromServer() {
        try {
            const response = await fetch(CLOUD_URL);
            const text = await response.text();
            masterData = text.trim() ? JSON.parse(text) : {};
            currentId = localStorage.getItem('gopi_active_id') || Object.keys(masterData)[0] || "";
            refreshUI();
            document.getElementById('syncStatus').innerText = "✅ Online";
        } catch (err) {
            document.getElementById('syncStatus').innerText = "📶 Offline";
            masterData = JSON.parse(localStorage.getItem('gopi_master_cloud')) || {};
            refreshUI();
        }
    }

    async function syncToServer() {
        document.getElementById('syncStatus').innerText = "⏳ Saving...";
        try {
            await fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(masterData) });
            document.getElementById('syncStatus').innerText = "✅ Saved";
        } catch (err) { document.getElementById('syncStatus').innerText = "❌ Sync Error"; }
    }

    function saveData() {
        localStorage.setItem('gopi_master_cloud', JSON.stringify(masterData));
        localStorage.setItem('gopi_active_id', currentId);
        syncToServer();
    }

    function showModal() { document.getElementById('modal').style.display = 'flex'; }
    function hideModal() { document.getElementById('modal').style.display = 'none'; }

    function registerKarigar() {
        const name = document.getElementById('newName').value;
        if (!name) return alert("Enter Name");
        const id = "K_" + Date.now();
        masterData[id] = { name, phone: document.getElementById('newPhone').value, dr: [], cr: [], rate: 0 };
        currentId = id; saveData(); hideModal(); refreshUI();
    }

    function addEntry(type) {
        if(!currentId) return alert("Select Karigar First");
        const wt = parseFloat(document.getElementById(type.toLowerCase() + 'Wt').value);
        if (isNaN(wt)) return alert("Enter Weight");
        let entry = { 
            date: document.getElementById(type.toLowerCase() + 'Date').value, 
            saman: document.getElementById(type.toLowerCase() + 'Saman').value, 
            wt: wt 
        };
        if (type === 'Cr') {
            if (wt < 1) { entry.rounded = 0; }
            else {
                let d = parseFloat((wt - Math.floor(wt)).toFixed(2));
                entry.rounded = (d < 0.35) ? Math.floor(wt) : (d < 0.9 ? Math.floor(wt) + 0.5 : Math.floor(wt) + 1);
            }
        }
        masterData[currentId][type.toLowerCase()].push(entry);
        saveData(); renderTable();
        const tableWrap = document.querySelector('.table-wrap');
        tableWrap.scrollTop = tableWrap.scrollHeight;
    }

    function calculate() {
        let k = masterData[currentId];
        if(!k) return;
        let rate = parseFloat(document.getElementById('rate').value) || 0;
        k.rate = rate;
        const totalDr = k.dr.reduce((s, i) => s + i.wt, 0);
        const totalCr = k.cr.reduce((s, i) => s + i.wt, 0);
        const totalNet = k.cr.reduce((s, i) => s + (i.rounded || 0), 0);
        const netBal = totalDr - totalCr;
        const fine = ((totalNet * 0.05) - netBal) * 0.916;
        
        document.getElementById('dispDr').innerText = totalDr.toFixed(3);
        document.getElementById('dispCr').innerText = totalCr.toFixed(3);
        document.getElementById('dispTotalNet').innerText = totalNet.toFixed(1);
        document.getElementById('dispBal').innerText = netBal.toFixed(3);
        document.getElementById('dispNet').innerText = fine.toFixed(5);
        document.getElementById('dispRs').innerText = "₹" + Math.abs(Math.round(fine * rate)).toLocaleString('en-IN');
    }

    function renderTable() {
        const body = document.getElementById('ledgerBody');
        body.innerHTML = '';
        let k = masterData[currentId];
        if(!k) return;
        const rows = Math.max(k.dr.length, k.cr.length);
        for (let i = 0; i < rows; i++) {
            const dr = k.dr[i]; const cr = k.cr[i];
            body.innerHTML += `<tr>
                <td>${dr ? dr.date : '-'}</td>
                <td>${dr ? dr.saman : '-'}</td>
                <td style="background:#fffafa;">${dr ? dr.wt.toFixed(3) : '-'} ${dr ? `<button class="btn-del-row" onclick="deleteRow('Dr', ${i})">x</button>` : ''}</td>
                <td>${cr ? cr.date : '-'}</td>
                <td>${cr ? cr.saman : '-'}</td>
                <td style="background:#fafffa;">${cr ? cr.wt.toFixed(3) : '-'} ${cr ? `<button class="btn-del-row" onclick="deleteRow('Cr', ${i})">x</button>` : ''}</td>
                <td style="font-weight:bold">${cr ? cr.rounded.toFixed(1) : '-'}</td>
            </tr>`;
        }
        calculate();
    }

    function refreshUI() {
        const selector = document.getElementById('karigarSelector');
        selector.innerHTML = '';
        Object.keys(masterData).forEach(id => {
            let opt = document.createElement('option');
            opt.value = id; opt.innerHTML = masterData[id].name;
            if(id === currentId) opt.selected = true;
            selector.appendChild(opt);
        });
        renderTable();
    }

    function switchKarigar() { currentId = document.getElementById('karigarSelector').value; localStorage.setItem('gopi_active_id', currentId); refreshUI(); }
    function deleteKarigar() { if(confirm("Delete Profile?")) { delete masterData[currentId]; currentId = Object.keys(masterData)[0] || ""; saveData(); refreshUI(); } }
    function deleteRow(type, index) { if(confirm("Delete entry?")) { (type === 'Dr' ? masterData[currentId].dr : masterData[currentId].cr).splice(index, 1); saveData(); renderTable(); } }

    function generatePDF() {
        const k = masterData[currentId];
        let pdfHTML = `<div style="padding:10px; font-family:sans-serif; text-align:center;">
            <h3>GOPI JEWELLERS</h3>
            <p>Karigar: ${k.name}</p>
            <table style="width:100%; border-collapse:collapse; font-size:10px;">
                <thead><tr style="background:#eee;"><th>Date</th><th>Dr Wt</th><th>Cr Wt</th><th>Net</th></tr></thead>
                <tbody>`;
        const rows = Math.max(k.dr.length, k.cr.length);
        for (let i = 0; i < rows; i++) {
            pdfHTML += `<tr>
                <td style="border:1px solid #ddd; padding:4px;">${k.dr[i]?.date || k.cr[i]?.date || '-'}</td>
                <td style="border:1px solid #ddd; padding:4px;">${k.dr[i]?.wt.toFixed(3) || '-'}</td>
                <td style="border:1px solid #ddd; padding:4px;">${k.cr[i]?.wt.toFixed(3) || '-'}</td>
                <td style="border:1px solid #ddd; padding:4px;">${k.cr[i]?.rounded.toFixed(1) || '-'}</td>
            </tr>`;
        }
        pdfHTML += `</tbody></table><div style="background:#1e3a8a; color:white; padding:10px; margin-top:10px;">
            <h3>Total: ${document.getElementById('dispRs').innerText}</h3>
        </div></div>`;
        html2pdf().from(pdfHTML).save(`${k.name}.pdf`);
    }
</script>
</body>
</html>
